<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* 背景：保持亮度 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.4)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.85);
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            pointer-events: none; 
        }

        /* 華麗典籍 UI */
        .ruina-book {
            pointer-events: auto;
            /* 透透的感覺：半透明黑色 + 毛玻璃模糊 */
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            width: 88%;
            max-width: 600px;
            padding: 80px 60px;
            position: relative;
            border-radius: 4px; /* Ruina 封面通常偏向方正但有極微圓角 */
            
            /* 基礎金色邊框 */
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            transform: rotate(-0.5deg);
        }

        /* 模擬圖片中的「四角裝飾線」 */
        .ruina-book::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
        }

        /* 華麗護角效果 */
        .corner-decor {
            position: absolute;
            width: 40px; height: 40px;
            border: 2px solid #d4af37;
            pointer-events: none;
        }
        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 4px 0 0; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 4px; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 4px 0; }

        /* 漣漪容器 */
        #ripple-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99;
            pointer-events: auto;
        }

        .ripple {
            position: absolute;
            border: 1px solid #d4af37;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            animation: ripple-out 0.9s cubic-bezier(0.1, 0.5, 0.5, 1) forwards;
            box-shadow: 0 0 20px #d4af37;
        }

        @keyframes ripple-out {
            from { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            to { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        /* 文字樣式：金色質感 */
        h1 {
            font-size: 3rem;
            letter-spacing: 18px;
            margin: 0 0 10px 0;
            color: #fff;
            text-align: center;
            opacity: 0;
            font-weight: 300;
        }

        .sub-title {
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 8px;
            color: #d4af37;
            margin-bottom: 50px;
            opacity: 0.7;
        }

        .data-row { 
            margin-bottom: 40px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding-bottom: 10px;
        }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            margin-bottom: 10px;
            letter-spacing: 5px;
            display: block;
            opacity: 0.8;
        }

        .value {
            font-size: 1.3rem;
            color: #333;
            line-height: 1.6;
            opacity: 0;
            filter: blur(10px);
            transition: 2s cubic-bezier(0.2, 0, 0.2, 1);
            display: block;
        }

        .value.engraved {
            opacity: 1; filter: blur(0px); color: #efefef;
            text-shadow: 0 0 12px #d4af37, 0 0 25px rgba(212, 175, 55, 0.3);
        }

        h1.engraved { opacity: 1; text-shadow: 0 0 25px #d4af37; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container"></div>
    
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <!-- 增加華麗護角 -->
            <div class="corner-decor top-left"></div>
            <div class="corner-decor top-right"></div>
            <div class="corner-decor bottom-left"></div>
            <div class="corner-decor bottom-right"></div>

            <h1 id="title-name">Sles</h1>
            <div class="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>

            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        // --- 漣漪效果 ---
        const rippleContainer = document.getElementById('ripple-container');
        function createRipple(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (!x || !y) return;
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const size = 150; 
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 900);
        }
        rippleContainer.addEventListener('mousedown', createRipple);
        rippleContainer.addEventListener('touchstart', (e) => { createRipple(e); e.preventDefault(); }, { passive: false });

        // --- 粒子系統 ---
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];
        function resize() { cBack.width = cFront.width = window.innerWidth; cBack.height = cFront.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.8 + 1.0;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.6 ? 'front' : 'back';
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -50) this.reset(false);
            }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 15; ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 65; i++) particles.push(new Particle());
        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(p.layer === 'front' ? ctxFront : ctxBack); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 文字刻印 ---
        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 800 + (i * 1000));
            });
        }
        window.onload = () => setTimeout(startEngraving, 500);
    </script>
</body>
</html>
