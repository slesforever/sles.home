<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #0a0a0a;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            user-select: none;
        }

        /* 背景：保持亮度，確保圖片清晰 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.75) contrast(1.1);
        }

        #effect-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 3;
        }

        /* Ruina 不規則 UI */
        .ruina-book {
            background: rgba(10, 10, 10, 0.9);
            width: 480px;
            padding: 60px 50px;
            position: relative;
            clip-path: polygon(2% 0%, 98% 5%, 100% 100%, 5% 95%, 0% 20%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* 標題與行樣式 */
        h1 {
            font-size: 2.5rem;
            letter-spacing: 12px;
            margin: 0 0 40px 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            display: inline-block;
            opacity: 0; /* 初始隱藏，由 JS 觸發 */
        }

        .data-row { margin-bottom: 35px; }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 4px;
            opacity: 0.6;
            display: block;
        }

        /* 螢光刻印文字動畫 */
        .value {
            font-size: 1.2rem;
            color: #fff;
            line-height: 1.6;
            opacity: 0;
            filter: blur(5px);
            transition: opacity 1.5s ease, filter 1.2s ease, text-shadow 1s ease;
            text-shadow: 0 0 0px rgba(212, 175, 55, 0);
        }

        /* 啟動刻印後的狀態 */
        .value.engraved {
            opacity: 1;
            filter: blur(0px);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.8), 0 0 15px rgba(212, 175, 55, 0.4);
        }

        h1.engraved {
            opacity: 1;
            transition: opacity 2s ease;
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="effect-canvas"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name">Sles</h1>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>

            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        // --- 螢光圓形粒子特效 ---
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 0.5 + 0.2;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y / 60) * 0.3;
                if (this.y < -50) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                // 螢光效果
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 螢光刻印動畫邏輯 ---
        function startEngraving() {
            const title = document.getElementById('title-name');
            const values = document.querySelectorAll('.value');

            // 標題先浮現
            setTimeout(() => {
                title.classList.add('engraved');
            }, 500);

            // 內容依序「刻」上去
            values.forEach((el, index) => {
                setTimeout(() => {
                    el.classList.add('engraved');
                }, 1200 + (index * 800)); // 每個區塊間隔 0.8 秒
            });
        }

        // 頁面載入後延遲開啟
        window.onload = () => {
            setTimeout(startEngraving, 500);
        };
    </script>
</body>
</html>
