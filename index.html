<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            /* 避免行動版長按出現選單或縮放 */
            touch-action: none;
            user-select: none;
        }

        /* 背景層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.5)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.8);
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            /* 讓點擊事件可以穿透到底部處理 */
            pointer-events: none; 
        }

        /* UI 本體：開啟 pointer-events 讓內部文字可點擊（如有需要）*/
        .ruina-book {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.96);
            width: 85%;
            max-width: 500px;
            padding: 50px 40px;
            position: relative;
            border-radius: 15px; 
            transform: rotate(-0.8deg);
            border: 2px solid rgba(212, 175, 55, 0.7);
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(212, 175, 55, 0.1);
        }

        /* 漣漪容器：覆蓋全螢幕捕捉點擊 */
        #ripple-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99; /* 放在最上層 */
            pointer-events: auto;
        }

        /* 漣漪視覺效果 */
        .ripple {
            position: absolute;
            border: 2px solid #d4af37;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            animation: ripple-out 0.8s ease-out forwards;
            box-shadow: 0 0 15px #d4af37, inset 0 0 10px #d4af37;
        }

        @keyframes ripple-out {
            from { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
            to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* 文字樣式維持不變 */
        h1 {
            font-size: 2.2rem;
            letter-spacing: 10px;
            margin: 0 0 20px 0;
            color: #fff;
            text-align: center;
            opacity: 0;
            transition: all 2s ease;
        }

        .header-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin-bottom: 30px;
            opacity: 0.6;
        }

        .data-row { 
            margin-bottom: 30px; 
            padding-left: 15px;
            border-left: 2px solid rgba(212, 175, 55, 0.15);
        }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 4px;
            opacity: 0.6;
            display: block;
        }

        .value {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
            opacity: 0;
            filter: blur(8px);
            transition: 1.5s ease;
            display: block;
        }

        .value.engraved {
            opacity: 1; filter: blur(0px); color: #fff;
            text-shadow: 0 0 10px #d4af37, 0 0 20px rgba(212, 175, 55, 0.4);
        }

        h1.engraved { opacity: 1; text-shadow: 0 0 20px #d4af37; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container"></div> <!-- 捕捉點擊與產生漣漪 -->
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name">Sles</h1>
            <div class="header-line"></div>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>

            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        // --- 霓虹漣漪邏輯 ---
        const rippleContainer = document.getElementById('ripple-container');

        function createRipple(e) {
            // 同時兼容滑鼠點擊與觸控
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (!x || !y) return;

            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            
            // 隨機漣漪大小，增加動態感
            const size = Math.random() * 50 + 100; 
            ripple.style.width = ripple.style.height = `${size}px`;
            
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;

            rippleContainer.appendChild(ripple);

            // 動畫結束後移除元素避免佔用記憶體
            setTimeout(() => { ripple.remove(); }, 800);
        }

        rippleContainer.addEventListener('mousedown', createRipple);
        rippleContainer.addEventListener('touchstart', (e) => {
            createRipple(e);
            // 避免觸發模擬的 mousedown
            e.preventDefault(); 
        }, { passive: false });

        // --- 螢光圓形粒子 (代碼維持之前的邏輯) ---
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];

        function resize() {
            cBack.width = cFront.width = window.innerWidth;
            cBack.height = cFront.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.6 ? 'front' : 'back';
                this.vx = (Math.random() - 0.5) * 0.5;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.vx;
                if (this.y < -50) this.reset(false);
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => {
                p.update();
                p.draw(p.layer === 'front' ? ctxFront : ctxBack);
            });
            requestAnimationFrame(animate);
        }
        animate();

        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 600 + (i * 800));
            });
        }
        window.onload = () => setTimeout(startEngraving, 500);
    </script>
</body>
</html>
