<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="https://cdn.fastly.steamstatic.com/steamcommunity/public/images/apps/1256670/207d5c0285aa4319eb1a5006c7b28234c78ed3fe.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles | Library Archive</title>
    <style>
        :root {
            --theme-color: #ffea95;
            --accent-glow: #64ffda;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #010101;
            color: var(--theme-color);
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
        }

        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('library.jpg');
            background-size: cover; background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 7; pointer-events: none; }

        /* --- 導航鈕：半隱藏與互動 --- */
        .page-nav {
            position: fixed;
            top: 50%;
            width: 55px;
            height: 55px;
            border: 2px solid var(--accent-glow);
            background: rgba(100, 255, 218, 0.05);
            cursor: pointer;
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .nav-left { left: 0; transform: translateY(-50%) translateX(-80%) rotate(45deg); }
        .nav-left:hover, .nav-left:active { transform: translateY(-50%) translateX(-40%) rotate(45deg); background: rgba(100, 255, 218, 0.2); }

        .nav-right { right: 0; transform: translateY(-50%) translateX(80%) rotate(45deg); }
        .nav-right:hover, .nav-right:active { transform: translateY(-50%) translateX(40%) rotate(45deg); background: rgba(100, 255, 218, 0.2); }

        .page-nav::after { content: ""; width: 30%; height: 30%; background: var(--accent-glow); filter: blur(5px); opacity: 0.5; }

        /* --- UI 卡片本體 --- */
        .main-container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; position: relative; z-index: 5; pointer-events: none; 
        }

        .ruina-book {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            width: 85%; max-width: 620px;
            padding: 65px 45px;
            position: relative;
            border: 1px solid rgba(255, 234, 149, 0.15);
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        /* 手機版適配 */
        @media (max-width: 480px) {
            .ruina-book { width: 78%; padding: 45px 22px; }
            h1 { letter-spacing: 6px !important; font-size: 2.3rem !important; }
            .sub-title { letter-spacing: 2px !important; margin-bottom: 35px !important; }
            .nav-left { transform: translateY(-50%) translateX(-88%) rotate(45deg); }
            .nav-right { transform: translateY(-50%) translateX(88%) rotate(45deg); }
        }

        /* 滑鼠追蹤發光層 */
        .ruina-book::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(500px circle at var(--mouse-x) var(--mouse-y), rgba(255, 234, 149, 0.08), transparent 45%);
            z-index: -1; pointer-events: none;
        }

        /* 文字動畫與樣式 */
        h1 { font-size: 3.5rem; letter-spacing: 18px; margin: 0; color: #fff; text-align: center; opacity: 0; font-weight: normal; }
        .sub-title { text-align: center; font-size: 0.65rem; letter-spacing: 8px; color: var(--theme-color); margin: 12px 0 45px 0; opacity: 0; }
        .data-row { margin-bottom: 35px; position: relative; padding-left: 18px; }
        .data-row::before { content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; background: var(--theme-color); transform: scaleY(0); transition: 0.6s; }
        .label { font-size: 0.6rem; color: var(--theme-color); margin-bottom: 6px; display: block; opacity: 0.7; }
        .value { font-size: 1.15rem; color: #fff; opacity: 0; display: block; }

        .engraved { animation: strong-breath 3.5s infinite ease-in-out; opacity: 1 !important; }
        .data-row.engraved::before { transform: scaleY(1); }

        @keyframes strong-breath {
            0%, 100% { opacity: 0.4; text-shadow: 0 0 5px var(--theme-color); }
            50% { opacity: 1; text-shadow: 0 0 20px var(--theme-color); }
        }

        /* 點擊波紋 */
        .ripple {
            position: absolute; border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border: 1px solid var(--accent-glow);
            box-shadow: 0 0 15px var(--accent-glow);
            animation: ripple-anim 0.4s ease-out forwards;
        }
        @keyframes ripple-anim { to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        /* 四角裝飾 */
        .corner-diamond { position: absolute; width: 8px; height: 8px; background: var(--theme-color); transform: rotate(45deg); box-shadow: 0 0 10px var(--theme-color); }
        .cd-tl { top: -4px; left: -4px; } .cd-tr { top: -4px; right: -4px; }
        .cd-bl { bottom: -4px; left: -4px; } .cd-br { bottom: -4px; right: -4px; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99; pointer-events:auto;"></div>
    
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="page-nav nav-left" id="btn-prev"></div>
    <div class="page-nav nav-right" id="btn-next"></div>

    <div class="main-container">
        <div class="ruina-book" id="ui-card">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>

            <h1 id="title-name">𝑆𝑙𝑒𝑠</h1>
            <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row" id="row-1">
                <span class="label">identity // Ego</span>
                <span class="value">human // developer</span>
            </div>
            <div class="data-row" id="row-2">
                <span class="label">Likes // love</span>
                <span class="value">Develop // novel</span>
            </div>
            <div class="data-row" id="row-3">
                <span class="label">Age // Birthday</span>
                <span class="value">15 // 9/21</span>
            </div>
        </div>
    </div>

    <script>
        const uiCard = document.getElementById('ui-card');
        
        // --- 1. 滑鼠追蹤發光 ---
        document.addEventListener('mousemove', (e) => {
            const rect = uiCard.getBoundingClientRect();
            uiCard.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            uiCard.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        // --- 2. 點擊波紋效果 ---
        const rippleContainer = document.getElementById('ripple-container');
        rippleContainer.addEventListener('mousedown', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = `80px`;
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        });

        // --- 3. 雙層粒子系統 ---
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];

        function resize() { 
            cBack.width = cFront.width = window.innerWidth; 
            cBack.height = cFront.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 60;
                this.radius = Math.random() * 1.8 + 0.6;
                this.speedY = Math.random() * 1.5 + 0.7;   
                this.opacity = Math.random() * 0.5 + 0.1;
                this.layer = Math.random() > 0.65 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -60) this.reset(false); }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 234, 149, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { 
                p.update(); 
                p.draw(p.layer === 'front' ? ctxFront : ctxBack); 
            });
            requestAnimationFrame(animate);
        }

        // --- 4. 刻印動畫啟動 ---
        function startEngraving() {
            setTimeout(() => { document.getElementById('title-name').classList.add('engraved'); }, 200);
            setTimeout(() => { document.getElementById('sub-title').classList.add('engraved'); }, 500);
            const rows = document.querySelectorAll('.data-row');
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    row.querySelector('.value').classList.add('engraved');
                }, 1000 + (i * 400));
            });
        }

        window.onload = () => {
            animate();
            startEngraving();
        };

        // 按鈕事件掛載
        document.getElementById('btn-prev').onclick = () => console.log("上傳/前頁功能");
        document.getElementById('btn-next').onclick = () => console.log("下載/後頁功能");
    </script>
</body>
</html>
