<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            user-select: none;
        }

        /* 背景層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.45)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.85) contrast(1.05);
        }

        /* 特效層 */
        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
        }

        /* 優化後的「微傾斜」典雅 UI */
        .ruina-book {
            background: rgba(12, 12, 12, 0.96);
            width: 520px;
            padding: 70px 60px;
            position: relative;
            /* 微妙的非對稱傾斜，不再有破爛感 */
            clip-path: polygon(1% 1%, 99% 0%, 100% 98%, 2% 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(212, 175, 55, 0.05);
        }

        /* 內層裝飾框：與外框形成微妙夾角 */
        .ruina-book::before {
            content: "";
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            clip-path: polygon(0% 0%, 100% 1%, 98% 100%, 1% 99%);
            pointer-events: none;
        }

        /* 頂部裝飾條 */
        .header-line {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.8), transparent);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 16px;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0);
            display: block;
            opacity: 0;
            transition: all 2.5s ease;
            text-align: center;
        }

        .data-row { 
            margin-bottom: 40px; 
            position: relative;
        }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            margin-bottom: 12px;
            letter-spacing: 6px;
            opacity: 0.5;
            display: block;
            font-weight: bold;
            text-transform: uppercase;
        }

        .value {
            font-size: 1.25rem;
            color: #f0f0f0;
            line-height: 1.7;
            opacity: 0;
            filter: blur(12px);
            transition: opacity 2s ease, filter 1.6s ease, text-shadow 1.2s ease;
            display: block;
        }

        /* 螢光刻印啟動 */
        .value.engraved {
            opacity: 1;
            filter: blur(0px);
            text-shadow: 0 0 10px rgba(212, 175, 55, 1), 0 0 20px rgba(212, 175, 55, 0.4);
        }

        h1.engraved { 
            opacity: 1; 
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8); 
        }

    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name">Sles</h1>
            <div class="header-line"></div>
            
            <div class="data-row">
                <span class="label">Identity // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>

            <div class="data-row">
                <span class="label">Status // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>

            <div class="data-row">
                <span class="label">Collection // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');

        let particles = [];

        function resize() {
            cBack.width = cFront.width = window.innerWidth;
            cBack.height = cFront.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 3.5 + 1.2;
                this.speedY = Math.random() * 1.8 + 0.6; // 快速上升
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.7 ? 'front' : 'back';
                this.vx = (Math.random() - 0.5) * 0.4;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.vx;
                if (this.y < -50) this.reset(false);
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 75; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => {
                p.update();
                p.draw(p.layer === 'front' ? ctxFront : ctxBack);
            });
            requestAnimationFrame(animate);
        }
        animate();

        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 1000 + (i * 900));
            });
        }
        window.onload = () => setTimeout(startEngraving, 500);
    </script>
</body>
</html>
