<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles | Library Archive</title>
    
    <!-- 引入高質感圖書館風格字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@300;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --theme-color: #ffea95;
            --theme-dim: rgba(255, 234, 149, 0.35);
            --accent-glow: #64ffda;
            --mouse-x: 50%;
            --mouse-y: 50%;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #010101;
            color: var(--theme-color);
            font-family: "Cinzel", "Noto Serif TC", "serif";
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* --- 背景圖層 --- */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.7)), url('library.jpg');
            background-size: cover;
            background-position: center;
            transform: scale(1.02);
            transition: transform 0.2s ease-out;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 7; pointer-events: none; }

        #ripple-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99;
            pointer-events: none;
        }

        /* --- 頂部與底部圖書館標題欄 (頂級氣氛感) --- */
        .library-header-bar {
            position: fixed;
            top: 20px;
            left: 30px;
            right: 30px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: "Share Tech Mono", monospace;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--theme-dim);
            border-bottom: 1px solid rgba(255, 234, 149, 0.15);
            padding-bottom: 8px;
            pointer-events: none;
        }

        .library-footer-bar {
            position: fixed;
            bottom: 20px;
            left: 30px;
            right: 30px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: "Share Tech Mono", monospace;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: rgba(255, 234, 149, 0.25);
            pointer-events: none;
        }

        /* --- 導航鈕 --- */
        .page-nav {
            position: fixed;
            top: 50%;
            width: clamp(45px, 10vw, 65px);
            height: clamp(45px, 10vw, 65px);
            border: 1px solid var(--accent-glow);
            background: rgba(100, 255, 218, 0.02);
            cursor: pointer;
            z-index: 100;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            outline: none;
        }

        .nav-left { left: -10px; transform: translateY(-50%) rotate(45deg); }
        .nav-right { right: -10px; transform: translateY(-50%) rotate(45deg); }

        .page-nav:hover, .page-nav:focus-visible {
            background: rgba(100, 255, 218, 0.15);
            box-shadow: 0 0 25px var(--accent-glow), inset 0 0 10px var(--accent-glow);
        }
        .nav-left:hover, .nav-left:focus-visible { transform: translateY(-50%) translateX(15px) rotate(45deg); }
        .nav-right:hover, .nav-right:focus-visible { transform: translateY(-50%) translateX(-15px) rotate(45deg); }

        /* --- UI 卡片與切換過渡效果 --- */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 5;
            perspective: 1000px;
            pointer-events: none;
        }

        .ruina-book {
            pointer-events: auto;
            background: rgba(8, 8, 12, 0.68);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            width: 85%;
            max-width: 580px;
            padding: clamp(45px, 7vh, 75px) clamp(28px, 5vw, 60px);
            position: relative;
            border: 1px solid rgba(255, 234, 149, 0.3);
            box-shadow: 0 30px 100px rgba(0,0,0,0.95), inset 0 0 20px rgba(255, 234, 149, 0.04);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
            transition: transform 0.15s ease-out, opacity 0.3s ease, filter 0.3s ease;
            will-change: transform, opacity, filter;
            overflow: hidden;
        }

        /* 掃描線 CRT 效果 (增加廢墟圖書館終端機感) */
        .ruina-book::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.015),
                rgba(0, 255, 0, 0.005),
                rgba(0, 0, 255, 0.015)
            );
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
        }

        .ruina-book.page-switching-next {
            opacity: 0;
            filter: blur(10px);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(-35px);
        }
        .ruina-book.page-switching-prev {
            opacity: 0;
            filter: blur(10px);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(35px);
        }

        .ruina-book::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(550px circle at var(--mouse-x) var(--mouse-y), rgba(255, 234, 149, 0.12), transparent 65%);
            z-index: 1; pointer-events: none;
        }

        @media (max-width: 480px) {
            .ruina-book { width: 78%; padding: 45px 22px; }
            h1 { letter-spacing: 8px !important; font-size: 2.1rem !important; }
            .sub-title { letter-spacing: 3px !important; margin-bottom: 35px !important; }
            .data-row { margin-bottom: 22px !important; }
            .library-header-bar, .library-footer-bar { font-size: 0.5rem; left: 15px; right: 15px; }
        }

        /* --- 文字與雕刻動畫 --- */
        .card-header-tag {
            font-family: "Share Tech Mono", monospace;
            font-size: 0.62rem;
            color: var(--theme-color);
            opacity: 0.5;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 6px;
        }

        h1 {
            font-size: clamp(2.4rem, 8vw, 3.6rem);
            letter-spacing: 16px;
            margin: 0; color: #fff; text-align: center; opacity: 0;
            font-weight: 400;
            position: relative;
            z-index: 2;
            transition: opacity 0.3s ease;
        }
        h1.engraved { animation: strong-breath 3.5s infinite ease-in-out; opacity: 1; }

        .sub-title { 
            text-align: center; font-size: clamp(0.55rem, 1.8vw, 0.7rem); 
            letter-spacing: 6px; color: var(--theme-color); margin: 10px 0 40px 0; opacity: 0; 
            position: relative; z-index: 2;
            transition: opacity 0.3s ease;
        }
        .sub-title.engraved { animation: strong-breath 3.5s infinite ease-in-out; animation-delay: 0.3s; opacity: 1; }

        .data-row { margin-bottom: 28px; position: relative; padding-left: 20px; z-index: 2; }
        .data-row::before { 
            content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; 
            background: var(--theme-color); transform: scaleY(0); transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 10px var(--theme-color);
        }
        .data-row.engraved::before { transform: scaleY(1); }

        .label { 
            font-family: "Share Tech Mono", monospace;
            font-size: 0.65rem; color: var(--theme-color); margin-bottom: 4px; display: block; opacity: 0.65; letter-spacing: 2px; 
        }
        .value { font-size: 1.1rem; color: #fff; opacity: 0; display: block; letter-spacing: 1px; transition: opacity 0.3s ease; }
        .value.engraved { animation: strong-breath 3.5s infinite ease-in-out; opacity: 1; }

        @keyframes strong-breath {
            0%, 100% { opacity: 0.6; text-shadow: 0 0 8px var(--theme-color); }
            50% { opacity: 1; text-shadow: 0 0 22px var(--theme-color), 0 0 8px #fff; }
        }

        .page-indicator {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-family: "Share Tech Mono", monospace;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--theme-color);
            opacity: 0.45;
            z-index: 2;
        }

        /* 菱形角落刻印 */
        .corner-diamond {
            position: absolute; width: 8px; height: 8px;
            background: var(--theme-color); transform: rotate(45deg);
            box-shadow: 0 0 8px var(--theme-color);
            transition: all 0.3s ease;
            z-index: 5;
        }
        .cd-tl { top: -4px; left: -4px; } .cd-tr { top: -4px; right: -4px; }
        .cd-bl { bottom: -4px; left: -4px; } .cd-br { bottom: -4px; right: -4px; }

        .ruina-book:hover .corner-diamond {
            box-shadow: 0 0 15px var(--theme-color), 0 0 5px #fff;
        }

        .ripple {
            position: absolute; border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border: 1px solid var(--accent-glow);
            box-shadow: 0 0 20px var(--accent-glow);
            animation: ripple-anim 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes ripple-anim { to { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }
    </style>
</head>
<body>

    <!-- 頂部與底部圖書館標誌性標題條 -->
    <div class="library-header-bar">
        <span>PATRON LIBRARIAN ARCHIVE</span>
        <span>INDEX // SECTOR-01</span>
    </div>

    <div class="library-footer-bar">
        <span>MAY YOU FIND YOUR BOOK IN THIS PLACE</span>
        <span>PROJECT MOON HONORED</span>
    </div>

    <div class="bg-layer" id="bg-layer"></div>
    <div id="ripple-container"></div>
    
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <button class="page-nav nav-left" id="btn-prev" aria-label="Previous Page"></button>
    <button class="page-nav nav-right" id="btn-next" aria-label="Next Page"></button>

    <div class="main-container">
        <div class="ruina-book" id="ui-card">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>

            <div class="card-header-tag">// RECORD OF LIB_01</div>
            <h1 id="title-name">𝑆𝑙𝑒𝑠</h1>
            <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div id="data-container">
                <div class="data-row">
                    <span class="label">Identity // Ego</span>
                    <span class="value">Human // Developer</span>
                </div>
                <div class="data-row">
                    <span class="label">Likes // Love</span>
                    <span class="value">Develop // Novel</span>
                </div>
                <div class="data-row">
                    <span class="label">Age // Birthday</span>
                    <span class="value">15 // 9/21</span>
                </div>
            </div>

            <div class="page-indicator" id="page-indicator">PAGE 01 / 03</div>
        </div>
    </div>

    <script>
        const uiCard = document.getElementById('ui-card');
        const rippleContainer = document.getElementById('ripple-container');
        const titleElem = document.getElementById('title-name');
        const subTitleElem = document.getElementById('sub-title');
        const dataContainer = document.getElementById('data-container');
        const pageIndicator = document.getElementById('page-indicator');

        // Web Audio API 按鈕微音效
        const playSfx = (type = 'click') => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'page') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.12);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                }
            } catch(e) {}
        };

        const pages = [
            {
                tag: "// RECORD OF LIB_01",
                title: "𝑆𝑙𝑒𝑠",
                subtitle: "BOOK, LIBRARIAN, STAR AND CITY",
                rows: [
                    { label: "Identity // Ego", value: "Human // Developer" },
                    { label: "Likes // Love", value: "Develop // Novel" },
                    { label: "Age // Birthday", value: "15 // 9/21" }
                ]
            },
            {
                tag: "// RECORD OF LIB_02",
                title: "𝐴𝑟𝑐ℎ𝑖𝑣𝑒",
                subtitle: "PROJECT MOON // RECORD DATABASE",
                rows: [
                    { label: "Library // Ruina", value: "Book of Flesh & Light" },
                    { label: "Lobotomy // Corp", value: "Seed of Light Project" },
                    { label: "Limbus // Company", value: "Executive Manager Log" }
                ]
            },
            {
                tag: "// RECORD OF LIB_03",
                title: "𝑊𝑜𝑟𝑘𝑠",
                subtitle: "CREATIVE & SCRIPTING ARCHIVE",
                rows: [
                    { label: "Game Dev // Engine", value: "Roblox Luau & Web Front-end" },
                    { label: "Storytelling // Lore", value: "Dark Medieval Fantasy / Tragedy" },
                    { label: "Status // Activity", value: "Active Development" }
                ]
            }
        ];

        let currentPage = 0;
        let isTransitioning = false;
        let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            mousePos.x = clientX;
            mousePos.y = clientY;

            const rect = uiCard.getBoundingClientRect();
            uiCard.style.setProperty('--mouse-x', `${clientX - rect.left}px`);
            uiCard.style.setProperty('--mouse-y', `${clientY - rect.top}px`);

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const tiltX = ((clientX - centerX) / centerX) * 6;
            const tiltY = ((clientY - centerY) / centerY) * -6;

            uiCard.style.setProperty('--tilt-x', `${tiltX}deg`);
            uiCard.style.setProperty('--tilt-y', `${tiltY}deg`);
        };

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', handleMove);

        const createRipple = (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            ripple.style.width = ripple.style.height = `70px`;
            ripple.style.left = `${clientX}px`;
            ripple.style.top = `${clientY}px`;
            rippleContainer.appendChild(ripple);
            playSfx('click');
            setTimeout(() => ripple.remove(), 500);
        };

        document.addEventListener('mousedown', createRipple);

        // 手機 Touch Swipe 滑動
        let touchStartX = 0;
        let touchEndX = 0;

        uiCard.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        uiCard.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const swipeDistance = touchEndX - touchStartX;
            if (Math.abs(swipeDistance) > 50) {
                if (swipeDistance < 0) switchPage('next');
                else switchPage('prev');
            }
        }, { passive: true });

        function startEngraving() {
            titleElem.classList.remove('engraved');
            subTitleElem.classList.remove('engraved');
            const rows = dataContainer.querySelectorAll('.data-row');
            rows.forEach(row => {
                row.classList.remove('engraved');
                const val = row.querySelector('.value');
                if (val) val.classList.remove('engraved');
            });

            setTimeout(() => { titleElem.classList.add('engraved'); }, 150);
            setTimeout(() => { subTitleElem.classList.add('engraved'); }, 450);
            
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    const val = row.querySelector('.value');
                    if (val) val.classList.add('engraved');
                }, 800 + (i * 300));
            });
        }

        function renderPageContent(pageIndex) {
            const data = pages[pageIndex];
            document.querySelector('.card-header-tag').textContent = data.tag;
            titleElem.textContent = data.title;
            subTitleElem.textContent = data.subtitle;

            dataContainer.innerHTML = data.rows.map(row => `
                <div class="data-row">
                    <span class="label">${row.label}</span>
                    <span class="value">${row.value}</span>
                </div>
            `).join('');

            pageIndicator.textContent = `PAGE 0${pageIndex + 1} / 0${pages.length}`;
        }

        function switchPage(direction) {
            if (isTransitioning) return;
            isTransitioning = true;
            playSfx('page');

            const targetClass = direction === 'next' ? 'page-switching-next' : 'page-switching-prev';
            uiCard.classList.add(targetClass);

            setTimeout(() => {
                if (direction === 'next') {
                    currentPage = (currentPage + 1) % pages.length;
                } else {
                    currentPage = (currentPage - 1 + pages.length) % pages.length;
                }

                renderPageContent(currentPage);
                uiCard.classList.remove(targetClass);
                startEngraving();

                setTimeout(() => { isTransitioning = false; }, 400);
            }, 300);
        }

        document.getElementById('btn-next').addEventListener('click', (e) => {
            e.stopPropagation();
            switchPage('next');
        });

        document.getElementById('btn-prev').addEventListener('click', (e) => {
            e.stopPropagation();
            switchPage('prev');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') switchPage('next');
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') switchPage('prev');
        });

        // Background Particles
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];

        function resize() { 
            cBack.width = cFront.width = window.innerWidth; 
            cBack.height = cFront.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 40;
                this.radius = Math.random() * 1.6 + 0.6;
                this.speedY = Math.random() * 0.9 + 0.4;   
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.15;
                this.layer = Math.random() > 0.65 ? 'front' : 'back';
            }
            update() { 
                this.y -= this.speedY; 
                this.x += this.speedX;

                const dx = mousePos.x - this.x;
                if (Math.abs(dx) < 150) {
                    this.x += dx * 0.0005;
                }

                if (this.y < -40) this.reset(false); 
            }
            draw() {
                const ctx = this.layer === 'front' ? ctxFront : ctxBack;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 234, 149, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            animate();
            renderPageContent(0);
            setTimeout(startEngraving, 250);
        };
    </script>
    <script src="music_module.js"></script>
</body>
</html>
