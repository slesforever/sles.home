<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="https://shared.fastly.steamstatic.com/community_assets/images/apps/1256670/6aae1f276e95e65de99d6ffea75f010167d5d0c6.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles | Library Archive</title>
    
    <!-- 引入古典圖書館風格字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --theme-color: #ffea95;
            --theme-dim: rgba(255, 234, 149, 0.35);
            --gold-glow: rgba(212, 175, 55, 0.6);
            --mouse-x: 50%;
            --mouse-y: 50%;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #020203;
            color: var(--theme-color);
            font-family: "Cinzel", "Noto Serif TC", "serif";
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* --- 光之種 Loading 畫面 --- */
        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #020203;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .seed-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .seed-core {
            width: 24px;
            height: 24px;
            background: #fffdf0;
            border-radius: 50%;
            box-shadow: 0 0 25px #fff, 0 0 50px #d4af37, 0 0 80px rgba(212, 175, 55, 0.8);
            animation: seed-pulse 2s infinite ease-in-out;
        }

        .seed-ring {
            position: absolute;
            border: 1px solid rgba(255, 234, 149, 0.4);
            border-radius: 50%;
            animation: ring-spin 8s linear infinite;
        }

        .ring-1 { width: 60px; height: 60px; border-top-color: #ffea95; border-bottom-color: transparent; }
        .ring-2 { width: 90px; height: 90px; border-right-color: #d4af37; border-left-color: transparent; animation-duration: 12s; animation-direction: reverse; }

        .loader-text {
            margin-top: 30px;
            font-size: 0.75rem;
            letter-spacing: 6px;
            color: var(--theme-color);
            opacity: 0.8;
            animation: gentle-breath 2s infinite ease-in-out;
        }

        @keyframes seed-pulse {
            0%, 100% { transform: scale(0.85); box-shadow: 0 0 20px #fff, 0 0 40px #d4af37; }
            50% { transform: scale(1.15); box-shadow: 0 0 35px #fff, 0 0 70px #d4af37, 0 0 100px rgba(255, 234, 149, 0.9); }
        }

        @keyframes ring-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- 背景圖層 --- */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.75)), url('library.jpg');
            background-size: cover;
            background-position: center;
            transform: scale(1.02);
            transition: transform 0.2s ease-out;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 7; pointer-events: none; }

        #ripple-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99;
            pointer-events: none;
        }

        /* --- 頂部與底部圖書館古典標示 --- */
        .library-header-bar {
            position: fixed;
            top: 25px;
            left: 40px;
            right: 40px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--theme-dim);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            padding-bottom: 8px;
            pointer-events: none;
        }

        .library-footer-bar {
            position: fixed;
            bottom: 25px;
            left: 40px;
            right: 40px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(255, 234, 149, 0.25);
            pointer-events: none;
        }

        /* --- 光之種 (Seed of Light) 典雅翻頁按鈕 --- */
        .page-nav {
            position: fixed;
            top: 50%;
            width: clamp(38px, 5vw, 46px);
            height: clamp(38px, 5vw, 46px);
            background: #fffdf0;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            outline: none;
            border: none;
            box-shadow: 0 0 20px #fff, 0 0 35px #d4af37, 0 0 55px rgba(212, 175, 55, 0.4);
            animation: seed-button-pulse 3.8s infinite ease-in-out;
        }

        .nav-left { left: clamp(20px, 4vw, 45px); transform: translateY(-50%); }
        .nav-right { right: clamp(20px, 4vw, 45px); transform: translateY(-50%); }

        /* 內嵌古典金屬幾何印記 */
        .page-nav::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: rgba(12, 12, 15, 0.88);
            transform: rotate(45deg);
            border: 1px solid #d4af37;
            transition: all 0.4s ease;
            box-shadow: inset 0 0 6px rgba(212, 175, 55, 0.5);
        }

        @keyframes seed-button-pulse {
            0%, 100% { 
                transform: translateY(-50%) scale(0.92); 
                box-shadow: 0 0 15px #fff, 0 0 30px #d4af37; 
            }
            50% { 
                transform: translateY(-50%) scale(1.05); 
                box-shadow: 0 0 30px #fff, 0 0 55px #d4af37, 0 0 80px rgba(255, 234, 149, 0.5); 
            }
        }

        .page-nav:hover, .page-nav:focus-visible {
            animation: none !important;
            transform: translateY(-50%) scale(1.22);
            background: #ffffff;
            box-shadow: 0 0 35px #fff, 0 0 70px #ffea95, 0 0 110px rgba(212, 175, 55, 0.85);
        }

        .page-nav:hover::after {
            background: #ffea95;
            border-color: #fff;
            box-shadow: 0 0 12px #ffea95;
            transform: rotate(225deg) scale(1.1);
        }

        .page-nav:active {
            transform: translateY(-50%) scale(0.9);
            box-shadow: 0 0 15px #fff, 0 0 25px #d4af37;
        }

        /* --- 古典書冊 UI 卡片 --- */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 5;
            perspective: 1000px;
            pointer-events: none;
        }

        .ruina-book {
            pointer-events: auto;
            background: rgba(10, 10, 14, 0.78);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            width: 85%;
            max-width: 560px;
            padding: clamp(45px, 7vh, 70px) clamp(28px, 5vw, 55px);
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 30px 90px rgba(0,0,0,0.95), inset 0 0 25px rgba(212, 175, 55, 0.05);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x));
            transition: transform 0.15s ease-out, opacity 0.4s ease, filter 0.4s ease;
            will-change: transform, opacity, filter;
            overflow: hidden;
        }

        .ruina-book.page-switching-next {
            opacity: 0;
            filter: blur(8px);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(-30px);
        }
        .ruina-book.page-switching-prev {
            opacity: 0;
            filter: blur(8px);
            transform: rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) translateX(30px);
        }

        .ruina-book::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(500px circle at var(--mouse-x) var(--mouse-y), rgba(255, 234, 149, 0.09), transparent 65%);
            z-index: 1; pointer-events: none;
        }

        @media (max-width: 480px) {
            .ruina-book { width: 78%; padding: 42px 22px; }
            h1 { letter-spacing: 8px !important; font-size: 2.1rem !important; }
            .sub-title { letter-spacing: 3px !important; margin-bottom: 35px !important; }
            .data-row { margin-bottom: 22px !important; }
            .library-header-bar, .library-footer-bar { font-size: 0.5rem; left: 15px; right: 15px; }
        }

        /* --- 排版與刻印質感 --- */
        .card-header-tag {
            font-size: 0.65rem;
            color: var(--theme-color);
            opacity: 0.5;
            letter-spacing: 5px;
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: clamp(2.3rem, 7.5vw, 3.4rem);
            letter-spacing: 14px;
            margin: 0; color: #fff; text-align: center; opacity: 0;
            font-weight: 400;
            position: relative;
            z-index: 2;
            transition: opacity 0.3s ease;
        }
        h1.engraved { animation: gentle-breath 4s infinite ease-in-out; opacity: 1; }

        .sub-title { 
            text-align: center; font-size: clamp(0.55rem, 1.8vw, 0.68rem); 
            letter-spacing: 5px; color: var(--theme-color); margin: 10px 0 38px 0; opacity: 0; 
            position: relative; z-index: 2;
            transition: opacity 0.3s ease;
        }
        .sub-title.engraved { animation: gentle-breath 4s infinite ease-in-out; animation-delay: 0.3s; opacity: 1; }

        .data-row { margin-bottom: 26px; position: relative; padding-left: 18px; z-index: 2; }
        .data-row::before { 
            content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; 
            background: var(--theme-color); transform: scaleY(0); transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 10px var(--theme-color);
        }
        .data-row.engraved::before { transform: scaleY(1); }

        .label { 
            font-size: 0.68rem; color: var(--theme-color); margin-bottom: 4px; display: block; opacity: 0.65; letter-spacing: 2px; 
        }
        .value { font-size: 1.05rem; color: #fff; opacity: 0; display: block; letter-spacing: 1px; transition: opacity 0.3s ease; }
        .value.engraved { animation: gentle-breath 4s infinite ease-in-out; opacity: 1; }

        @keyframes gentle-breath {
            0%, 100% { opacity: 0.65; text-shadow: 0 0 8px rgba(255, 234, 149, 0.4); }
            50% { opacity: 1; text-shadow: 0 0 18px var(--theme-color), 0 0 6px #fff; }
        }

        .page-indicator {
            position: absolute;
            bottom: 16px;
            right: 22px;
            font-size: 0.68rem;
            letter-spacing: 2px;
            color: var(--theme-color);
            opacity: 0.45;
            z-index: 2;
        }

        /* 典雅角邊印記 */
        .corner-diamond {
            position: absolute; width: 7px; height: 7px;
            background: var(--theme-color); transform: rotate(45deg);
            box-shadow: 0 0 8px var(--theme-color);
            transition: all 0.3s ease;
            z-index: 5;
        }
        .cd-tl { top: -4px; left: -4px; } .cd-tr { top: -4px; right: -4px; }
        .cd-bl { bottom: -4px; left: -4px; } .cd-br { bottom: -4px; right: -4px; }

        .ruina-book:hover .corner-diamond {
            box-shadow: 0 0 15px var(--theme-color), 0 0 5px #fff;
        }

        /* 點擊光輝漣漪 */
        .ripple {
            position: absolute; border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border: 1px solid #ffea95;
            box-shadow: 0 0 25px #d4af37;
            animation: ripple-anim 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes ripple-anim { to { transform: translate(-50%, -50%) scale(2.5); opacity: 0; } }
    </style>
</head>
<body>

    <!-- 光之種 Loading 畫面 -->
    <div id="loader">
        <div class="seed-container">
            <div class="seed-ring ring-1"></div>
            <div class="seed-ring ring-2"></div>
            <div class="seed-core"></div>
        </div>
        <div class="loader-text">INITIALIZING ARCHIVE...</div>
    </div>

    <div class="library-header-bar">
        <span>PATRON LIBRARIAN ARCHIVE</span>
        <span>SECTOR-01</span>
    </div>

    <div class="library-footer-bar">
        <span>MAY YOU FIND YOUR BOOK IN THIS PLACE</span>
        <span>PROJECT MOON</span>
    </div>

    <div class="bg-layer" id="bg-layer"></div>
    <div id="ripple-container"></div>
    
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <!-- 光之種風格按鈕 -->
    <button class="page-nav nav-left" id="btn-prev" aria-label="Previous Page"></button>
    <button class="page-nav nav-right" id="btn-next" aria-label="Next Page"></button>

    <div class="main-container">
        <div class="ruina-book" id="ui-card">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>

            <div class="card-header-tag">RECORD OF LIBRARIAN</div>
            <h1 id="title-name">𝑆𝑙𝑒𝑠</h1>
            <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div id="data-container">
                <div class="data-row">
                    <span class="label">Identity // Ego</span>
                    <span class="value">Human // Developer</span>
                </div>
                <div class="data-row">
                    <span class="label">Likes // Love</span>
                    <span class="value">Develop // Novel</span>
                </div>
                <div class="data-row">
                    <span class="label">Age // Birthday</span>
                    <span class="value">15 // 9/21</span>
                </div>
            </div>

            <div class="page-indicator" id="page-indicator">PAGE 01 / 03</div>
        </div>
    </div>

    <script>
        /* --- 背景 BGM 音樂播放器邏輯 --- */
        const bgm = new Audio('https://project-moon-archive.vercel.app/bgm.mp3');
        bgm.loop = true;
        bgm.volume = 0.35;

        const startAudio = () => {
            bgm.play().catch(() => {});
            document.removeEventListener('click', startAudio);
            document.removeEventListener('keydown', startAudio);
        };
        document.addEventListener('click', startAudio);
        document.addEventListener('keydown', startAudio);

        const uiCard = document.getElementById('ui-card');
        const rippleContainer = document.getElementById('ripple-container');
        const titleElem = document.getElementById('title-name');
        const subTitleElem = document.getElementById('sub-title');
        const dataContainer = document.getElementById('data-container');
        const pageIndicator = document.getElementById('page-indicator');
        const loader = document.getElementById('loader');

        /* --- 帶有圖書館大廳空間迴音 (Spatial Echo/Reverb) 的 Web Audio 音效 --- */
        const playSfx = (type = 'click') => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (type === 'click') {
                    // 主點擊音調
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.04, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);

                    // 大廳空間殘響 / 迴音層 (Echo Tail)
                    const echoOsc = ctx.createOscillator();
                    const echoGain = ctx.createGain();
                    echoOsc.type = 'sine';
                    echoOsc.frequency.setValueAtTime(220, ctx.currentTime + 0.05);
                    echoOsc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.3);
                    echoGain.gain.setValueAtTime(0.012, ctx.currentTime + 0.05);
                    echoGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
                    echoOsc.connect(echoGain);
                    echoGain.connect(ctx.destination);
                    echoOsc.start(ctx.currentTime + 0.05);
                    echoOsc.stop(ctx.currentTime + 0.3);

                } else if (type === 'page') {
                    // 翻頁時的微弱空間低頻流動聲
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(360, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.03, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch(e) {}
        };

        const pages = [
            {
                tag: "RECORD OF LIBRARIAN",
                title: "𝑆𝑙𝑒𝑠",
                subtitle: "BOOK, LIBRARIAN, STAR AND CITY",
                rows: [
                    { label: "Identity // Ego", value: "Human // Developer" },
                    { label: "Likes // Love", value: "Develop // Novel" },
                    { label: "Age // Birthday", value: "15 // 9/21" }
                ]
            },
            {
                tag: "ARCHIVE DATABASE",
                title: "𝐴𝑟𝑐ℎ𝑖𝑣𝑒",
                subtitle: "PROJECT MOON // RECORD DATABASE",
                rows: [
                    { label: "Library // Ruina", value: "Book of Flesh & Light" },
                    { label: "Lobotomy // Corp", value: "Seed of Light Project" },
                    { label: "Limbus // Company", value: "Executive Manager Log" }
                ]
            },
            {
                tag: "CREATIVE WORKS",
                title: "𝑊𝑜𝑟𝑘𝑠",
                subtitle: "CREATIVE & SCRIPTING ARCHIVE",
                rows: [
                    { label: "Game Dev // Engine", value: "Roblox Luau & Web Front-end" },
                    { label: "Storytelling // Lore", value: "Dark Medieval Fantasy / Tragedy" },
                    { label: "Status // Activity", value: "Active Development" }
                ]
            }
        ];

        let currentPage = 0;
        let isTransitioning = false;
        let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            mousePos.x = clientX;
            mousePos.y = clientY;

            const rect = uiCard.getBoundingClientRect();
            uiCard.style.setProperty('--mouse-x', `${clientX - rect.left}px`);
            uiCard.style.setProperty('--mouse-y', `${clientY - rect.top}px`);

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const tiltX = ((clientX - centerX) / centerX) * 5;
            const tiltY = ((clientY - centerY) / centerY) * -5;

            uiCard.style.setProperty('--tilt-x', `${tiltX}deg`);
            uiCard.style.setProperty('--tilt-y', `${tiltY}deg`);
        };

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', handleMove);

        const createRipple = (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            ripple.style.width = ripple.style.height = `60px`;
            ripple.style.left = `${clientX}px`;
            ripple.style.top = `${clientY}px`;
            rippleContainer.appendChild(ripple);
            playSfx('click');
            setTimeout(() => ripple.remove(), 600);
        };

        document.addEventListener('mousedown', createRipple);

        // 手機 Touch 滑動
        let touchStartX = 0;
        let touchEndX = 0;

        uiCard.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        uiCard.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const swipeDistance = touchEndX - touchStartX;
            if (Math.abs(swipeDistance) > 50) {
                if (swipeDistance < 0) switchPage('next');
                else switchPage('prev');
            }
        }, { passive: true });

        function startEngraving() {
            titleElem.classList.remove('engraved');
            subTitleElem.classList.remove('engraved');
            const rows = dataContainer.querySelectorAll('.data-row');
            rows.forEach(row => {
                row.classList.remove('engraved');
                const val = row.querySelector('.value');
                if (val) val.classList.remove('engraved');
            });

            setTimeout(() => { titleElem.classList.add('engraved'); }, 150);
            setTimeout(() => { subTitleElem.classList.add('engraved'); }, 400);
            
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    const val = row.querySelector('.value');
                    if (val) val.classList.add('engraved');
                }, 700 + (i * 250));
            });
        }

        function renderPageContent(pageIndex) {
            const data = pages[pageIndex];
            document.querySelector('.card-header-tag').textContent = data.tag;
            titleElem.textContent = data.title;
            subTitleElem.textContent = data.subtitle;

            dataContainer.innerHTML = data.rows.map(row => `
                <div class="data-row">
                    <span class="label">${row.label}</span>
                    <span class="value">${row.value}</span>
                </div>
            `).join('');

            pageIndicator.textContent = `PAGE 0${pageIndex + 1} / 0${pages.length}`;
        }

        function switchPage(direction) {
            if (isTransitioning) return;
            isTransitioning = true;
            playSfx('page');

            const targetClass = direction === 'next' ? 'page-switching-next' : 'page-switching-prev';
            uiCard.classList.add(targetClass);

            setTimeout(() => {
                if (direction === 'next') {
                    currentPage = (currentPage + 1) % pages.length;
                } else {
                    currentPage = (currentPage - 1 + pages.length) % pages.length;
                }

                renderPageContent(currentPage);
                uiCard.classList.remove(targetClass);
                startEngraving();

                setTimeout(() => { isTransitioning = false; }, 400);
            }, 300);
        }

        document.getElementById('btn-next').addEventListener('click', (e) => {
            e.stopPropagation();
            switchPage('next');
        });

        document.getElementById('btn-prev').addEventListener('click', (e) => {
            e.stopPropagation();
            switchPage('prev');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') switchPage('next');
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') switchPage('prev');
        });

        // 背景柔和光之粒子
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];

        function resize() { 
            cBack.width = cFront.width = window.innerWidth; 
            cBack.height = cFront.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 30;
                this.radius = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.8 + 0.3;   
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.45 + 0.15;
                this.layer = Math.random() > 0.6 ? 'front' : 'back';
            }
            update() { 
                this.y -= this.speedY; 
                this.x += this.speedX;

                const dx = mousePos.x - this.x;
                if (Math.abs(dx) < 140) {
                    this.x += dx * 0.0004;
                }

                if (this.y < -30) this.reset(false); 
            }
            draw() {
                const ctx = this.layer === 'front' ? ctxFront : ctxBack;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 234, 149, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            animate();
            renderPageContent(0);
            
            // 光之種 Loading 動畫淡出 logic
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                setTimeout(startEngraving, 300);
            }, 800);
        };
    </script>
    <script src="music_module.js"></script>
</body>
</html>
