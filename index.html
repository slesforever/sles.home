<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="https://cdn.fastly.steamstatic.com/steamcommunity/public/images/apps/1256670/207d5c0285aa4319eb1a5006c7b28234c78ed3fe.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles | Library Archive</title>
    <style>
        :root {
            --theme-color: #ffea95;
            --accent-glow: #64ffda;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #010101;
            color: var(--theme-color);
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('library.jpg');
            background-size: cover;
            background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 7; pointer-events: none; }

        /* --- 導航鈕：移動端深度優化 --- */
        .page-nav {
            position: fixed;
            top: 50%;
            width: clamp(50px, 15vw, 75px);
            height: clamp(50px, 15vw, 75px);
            border: 2px solid var(--accent-glow);
            background: rgba(100, 255, 218, 0.03);
            cursor: pointer;
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* 左鈕：在手機上藏更深 */
        .nav-left {
            left: 0;
            transform: translateY(-50%) translateX(-85%) rotate(45deg);
        }
        /* 右鈕：在手機上藏更深 */
        .nav-right {
            right: 0;
            transform: translateY(-50%) translateX(85%) rotate(45deg);
        }

        /* 觸碰或懸停時彈出 */
        .page-nav:active, .page-nav:hover {
            background: rgba(100, 255, 218, 0.2);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .nav-left:active, .nav-left:hover { transform: translateY(-50%) translateX(-35%) rotate(45deg); }
        .nav-right:active, .nav-right:hover { transform: translateY(-50%) translateX(35%) rotate(45deg); }

        .page-nav::after {
            content: "";
            width: 20%; height: 20%;
            background: var(--accent-glow);
            filter: blur(4px);
            opacity: 0.5;
        }

        /* --- 主容器與 UI 卡片 --- */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 5;
            pointer-events: none; 
        }

        .ruina-book {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.82);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            width: 88%;
            max-width: 600px; 
            padding: clamp(40px, 8vh, 80px) clamp(25px, 6vw, 60px);
            position: relative;
            border: 1px solid rgba(255, 234, 149, 0.2);
            box-shadow: 0 0 100px rgba(0,0,0,1);
            transition: transform 0.3s ease, width 0.3s ease;
        }

        /* 手機版排版修正 */
        @media (max-width: 480px) {
            .ruina-book {
                width: 76%; /* 讓出兩側空間給菱形 */
                padding: 50px 25px;
            }
            h1 { letter-spacing: 6px !important; font-size: 2.2rem !important; }
            .sub-title { letter-spacing: 2px !important; margin-bottom: 40px !important; }
            .data-row { margin-bottom: 25px !important; }
        }

        /* 滑鼠追蹤發光 (支援觸控位置) */
        .ruina-book::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(255, 234, 149, 0.08), transparent 45%);
            z-index: -1; pointer-events: none;
        }

        /* 文字與動畫樣式 */
        h1 {
            font-size: clamp(2.5rem, 10vw, 3.8rem);
            letter-spacing: 18px;
            margin: 0; color: #fff; text-align: center; opacity: 0;
        }
        h1.engraved { animation: strong-breath 3.5s infinite ease-in-out; opacity: 1; }

        .sub-title { 
            text-align: center; font-size: clamp(0.5rem, 2vw, 0.7rem); 
            letter-spacing: 8px; color: var(--theme-color); margin: 15px 0 50px 0; opacity: 0; 
        }
        .sub-title.engraved { animation: strong-breath 3.5s infinite ease-in-out; animation-delay: 0.3s; opacity: 1; }

        .data-row { margin-bottom: 35px; position: relative; padding-left: 20px; }
        .data-row::before { 
            content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; 
            background: var(--theme-color); transform: scaleY(0); transition: 0.8s ease;
            box-shadow: 0 0 10px var(--theme-color);
        }
        .data-row.engraved::before { transform: scaleY(1); }

        .label { font-size: 0.6rem; color: var(--theme-color); margin-bottom: 5px; display: block; opacity: 0.7; letter-spacing: 1px; }
        .value { font-size: 1.15rem; color: #fff; opacity: 0; display: block; }
        .value.engraved { animation: strong-breath 3.5s infinite ease-in-out; opacity: 1; }

        @keyframes strong-breath {
            0%, 100% { opacity: 0.5; text-shadow: 0 0 10px var(--theme-color); }
            50% { opacity: 1; text-shadow: 0 0 25px var(--theme-color), 0 0 10px #fff; }
        }

        /* 四角裝飾 */
        .corner-diamond {
            position: absolute; width: 10px; height: 10px;
            background: var(--theme-color); transform: rotate(45deg);
            box-shadow: 0 0 10px var(--theme-color);
        }
        .cd-tl { top: -5px; left: -5px; } .cd-tr { top: -5px; right: -5px; }
        .cd-bl { bottom: -5px; left: -5px; } .cd-br { bottom: -5px; right: -5px; }

        /* 點擊波紋 */
        .ripple {
            position: absolute; border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border: 1px solid var(--accent-glow);
            box-shadow: 0 0 15px var(--accent-glow);
            animation: ripple-anim 0.4s ease-out forwards;
        }
        @keyframes ripple-anim { to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99; pointer-events:auto;"></div>
    
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="page-nav nav-left" id="btn-prev"></div>
    <div class="page-nav nav-right" id="btn-next"></div>

    <div class="main-container">
        <div class="ruina-book" id="ui-card">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>

            <h1 id="title-name">𝑆𝑙𝑒𝑠</h1>
            <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row" id="row-1">
                <span class="label">identity // Ego</span>
                <span class="value">human // developer</span>
            </div>
            <div class="data-row" id="row-2">
                <span class="label">Likes // love</span>
                <span class="value">Develop // novel</span>
            </div>
            <div class="data-row" id="row-3">
                <span class="label">Age // Birthday</span>
                <span class="value">15 // 9/21</span>
            </div>
        </div>
    </div>

    <script>
        const uiCard = document.getElementById('ui-card');
        const rippleContainer = document.getElementById('ripple-container');

        // --- 1. 滑鼠與觸控追蹤 (支援移動端發光) ---
        const handleMove = (e) => {
            const rect = uiCard.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            uiCard.style.setProperty('--mouse-x', `${clientX - rect.left}px`);
            uiCard.style.setProperty('--mouse-y', `${clientY - rect.top}px`);
        };
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', handleMove);

        // --- 2. 點擊波紋 ---
        const createRipple = (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            ripple.style.width = ripple.style.height = `80px`;
            ripple.style.left = `${clientX}px`;
            ripple.style.top = `${clientY}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        };
        rippleContainer.addEventListener('mousedown', createRipple);
        rippleContainer.addEventListener('touchstart', createRipple);

        // --- 3. 雙層粒子系統 (效能優化版) ---
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];

        function resize() { 
            cBack.width = cFront.width = window.innerWidth; 
            cBack.height = cFront.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 60;
                this.radius = Math.random() * 1.5 + 0.8;
                this.speedY = Math.random() * 1.2 + 0.6;   
                this.opacity = Math.random() * 0.4 + 0.1;
                this.layer = Math.random() > 0.7 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -60) this.reset(false); }
            draw() {
                const ctx = this.layer === 'front' ? ctxFront : ctxBack;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 234, 149, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        // --- 4. 啟動動畫 ---
        function startEngraving() {
            setTimeout(() => { document.getElementById('title-name').classList.add('engraved'); }, 200);
            setTimeout(() => { document.getElementById('sub-title').classList.add('engraved'); }, 600);
            const rows = document.querySelectorAll('.data-row');
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    row.querySelector('.value').classList.add('engraved');
                }, 1100 + (i * 450));
            });
        }

        window.onload = () => {
            animate();
            setTimeout(startEngraving, 300);
        };
    </script>
    <script src="music_module.js"></script>
</body>
</html>
