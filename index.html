<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "Georgia", "serif", "Microsoft JhengHei";
            overflow: hidden;
            user-select: none;
        }

        /* 背景：增加一點羊皮紙感 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-color: #1a1005;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: sepia(0.3) brightness(0.4);
        }

        #effect-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 3;
        }

        /* 仿 Ruina 書頁：增加紙張紋理感 */
        .ruina-book {
            background: rgba(15, 12, 10, 0.95);
            width: 450px;
            min-height: 300px;
            padding: 60px 40px;
            border: 1px solid #d4af37;
            position: relative;
            /* 幾何裁切 */
            clip-path: polygon(0 30px, 30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        /* 內部邊框線 */
        .ruina-book::after {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
            clip-path: polygon(0 25px, 25px 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            letter-spacing: 15px;
            margin: 0 0 40px 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .data-row {
            margin-bottom: 30px;
            position: relative;
        }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 3px;
            opacity: 0.7;
            display: block;
        }

        /* 打字機文字樣式 */
        .value {
            font-size: 1.1rem;
            color: #c0c0c0;
            line-height: 1.8;
            min-height: 1.5em;
            display: inline-block;
        }

        /* 游標閃爍效果 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2rem;
            background: #d4af37;
            margin-left: 5px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="effect-canvas"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name"></h1>
            
            <div class="data-row">
                <span class="label">IDENTITY</span>
                <span class="value" id="text-identity"></span>
            </div>

            <div class="data-row">
                <span class="label">STATUS</span>
                <span class="value" id="text-status"></span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION</span>
                <span class="value" id="text-collection"></span>
            </div>
        </div>
    </div>

    <script>
        // --- 特效：金色光束 ---
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 100;
                this.width = Math.random() * 1.5;
                this.height = Math.random() * 20 + 5;
                this.speedY = Math.random() * 1 + 0.3;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -50) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 特效：文字慢慢刻上 (Typewriter) ---
        const content = [
            { id: 'title-name', text: 'Sles' },
            { id: 'text-identity', text: '開發者 / 創作編劇' },
            { id: 'text-status', text: '在此處整理著散落的記憶與光芒。' },
            { id: 'text-collection', text: 'Project Moon Archive / Roblox Logic' }
        ];

        async function typeWriter(id, text, speed = 100) {
            const element = document.getElementById(id);
            // 加上游標
            element.innerHTML = '<span class="cursor"></span>';
            const cursor = element.querySelector('.cursor');

            for (let i = 0; i < text.length; i++) {
                // 將文字插入到游標之前
                cursor.insertAdjacentHTML('beforebegin', text.charAt(i));
                await new Promise(res => setTimeout(res, speed + Math.random() * 50));
            }
            // 結束後移除游標 (或保留)
            cursor.remove();
        }

        async function startSequentially() {
            for (const item of content) {
                await typeWriter(item.id, item.text, 80);
                await new Promise(res => setTimeout(res, 300)); // 每行間隔
            }
        }

        // 延遲一點點開始，更有氛圍
        setTimeout(startSequentially, 1000);
    </script>
</body>
</html>
