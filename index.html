<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #d4af37; /* 經典金金色 */
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden;
        }

        /* 背景圖層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('library.jpg') no-repeat center center;
            background-size: cover;
            filter: brightness(0.4) contrast(1.2);
            z-index: -2;
        }

        /* 特效畫布層 */
        #effect-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: -1;
            pointer-events: none;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 仿 Library of Ruina 書頁 UI */
        .ruina-book {
            background: rgba(15, 15, 15, 0.9);
            width: 450px;
            padding: 40px;
            border: 2px solid #d4af37;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.3), 0 0 30px rgba(0,0,0,0.8);
            position: relative;
            clip-path: polygon(0 5%, 5% 0, 95% 0, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0 95%);
        }

        .ruina-book::before {
            content: "";
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            pointer-events: none;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }

        .data-row {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        .label {
            font-size: 0.8rem;
            color: #888;
            display: block;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.1rem;
            color: #efefef;
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="effect-canvas"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1>Sles</h1>
            
            <div class="data-row">
                <span class="label">IDENTITY</span>
                <span class="value">開發者 / 編劇</span>
            </div>

            <div class="data-row">
                <span class="label">STATUS</span>
                <span class="value">正在整理圖書館的館藏中...</span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION</span>
                <span class="value">Project Moon Archive, Roblox Combat Script</span>
            </div>
        </div>
    </div>

    <!-- 引入獨立特效腳本 -->
    <script src="effects.js"></script>
</body>
</html>
