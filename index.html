<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* 背景層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.5)), url('library.jpg');
            background-size: cover;
            background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            pointer-events: none; 
        }

        /* 華麗典籍 UI 主體 */
        .ruina-book {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 90%;
            max-width: 650px;
            padding: 90px 50px;
            position: relative;
            border: 2px solid #d4af37;
            box-shadow: 0 0 60px rgba(0,0,0,1), inset 0 0 30px rgba(212, 175, 55, 0.1);
            transform: rotate(-0.3deg);
        }

        /* 內層裝飾細線 */
        .inner-border {
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            pointer-events: none;
        }

        /* SVG 裝飾角樣式 */
        .corner-svg {
            position: absolute;
            width: 80px;
            height: 80px;
            fill: #d4af37;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5));
            pointer-events: none;
        }
        .top-left-svg { top: -5px; left: -5px; }
        .top-right-svg { top: -5px; right: -5px; transform: scaleX(-1); }
        .bottom-left-svg { bottom: -5px; left: -5px; transform: scaleY(-1); }
        .bottom-right-svg { bottom: -5px; right: -5px; transform: scale(-1); }

        /* 頂部中央飾徽 */
        .top-center-decor {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            fill: #d4af37;
            pointer-events: none;
        }

        /* 雙重漣漪效應 */
        #ripple-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; pointer-events: auto; }
        .ripple {
            position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0);
        }
        .ripple-1 {
            border: 1px solid #d4af37;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 70%);
            animation: ripple-out-1 0.8s cubic-bezier(0.1, 0.5, 0.5, 1) forwards;
            box-shadow: 0 0 25px #d4af37;
        }
        .ripple-2 {
            border: 1px solid rgba(212, 175, 55, 0.4);
            animation: ripple-out-2 1s cubic-bezier(0.2, 0.4, 0.4, 1) 0.1s forwards;
        }
        @keyframes ripple-out-1 { from { transform: translate(-50%, -50%) scale(0); opacity: 1; } to { transform: translate(-50%, -50%) scale(2.5); opacity: 0; } }
        @keyframes ripple-out-2 { from { transform: translate(-50%, -50%) scale(0); opacity: 0.6; } to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        /* 文字樣式 */
        h1 { font-size: 3.2rem; letter-spacing: 20px; margin: 0; color: #fff; text-align: center; opacity: 0; font-weight: normal; }
        .sub-title { text-align: center; font-size: 0.8rem; letter-spacing: 10px; color: #d4af37; margin: 15px 0 60px 0; opacity: 0.7; }
        .data-row { margin-bottom: 45px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding-bottom: 12px; }
        .label { font-size: 0.75rem; color: #d4af37; margin-bottom: 12px; letter-spacing: 6px; display: block; opacity: 0.8; }
        .value { font-size: 1.4rem; color: #333; opacity: 0; filter: blur(10px); transition: 2s cubic-bezier(0.16, 1, 0.3, 1); display: block; }
        .value.engraved { opacity: 1; filter: blur(0px); color: #fff; text-shadow: 0 0 15px #d4af37; }
        h1.engraved { opacity: 1; text-shadow: 0 0 30px #d4af37; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <!-- 頂部飾徽 SVG -->
            <svg class="top-center-decor" viewBox="0 0 100 30">
                <path d="M50,5 Q60,25 90,25 M50,5 Q40,25 10,25 M50,5 L50,30 M35,15 Q50,10 65,15" fill="none" stroke="#d4af37" stroke-width="1.5"/>
                <circle cx="50" cy="5" r="2" />
            </svg>

            <!-- 四角華麗 SVG -->
            <svg class="corner-svg top-left-svg" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q20,0 20,20 L20,40 M10,10 Q10,30 30,30 M0,0 Q50,5 50,20 Q40,35 20,30" fill="none" stroke="#d4af37" stroke-width="2.5"/>
            </svg>
            <svg class="corner-svg top-right-svg" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q20,0 20,20 L20,40 M10,10 Q10,30 30,30 M0,0 Q50,5 50,20 Q40,35 20,30" fill="none" stroke="#d4af37" stroke-width="2.5"/>
            </svg>
            <svg class="corner-svg bottom-left-svg" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q20,0 20,20 L20,40 M10,10 Q10,30 30,30 M0,0 Q50,5 50,20 Q40,35 20,30" fill="none" stroke="#d4af37" stroke-width="2.5"/>
            </svg>
            <svg class="corner-svg bottom-right-svg" viewBox="0 0 100 100">
                <path d="M0,0 L40,0 Q20,0 20,20 L20,40 M10,10 Q10,30 30,30 M0,0 Q50,5 50,20 Q40,35 20,30" fill="none" stroke="#d4af37" stroke-width="2.5"/>
            </svg>

            <div class="inner-border"></div>

            <h1 id="title-name">Sles</h1>
            <div class="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>
            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>
            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        const rippleContainer = document.getElementById('ripple-container');
        function createRipple(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (!x || !y) return;
            addRippleElement(x, y, 'ripple-1');
            addRippleElement(x, y, 'ripple-2');
        }
        function addRippleElement(x, y, className) {
            const ripple = document.createElement('div');
            ripple.className = `ripple ${className}`;
            ripple.style.width = ripple.style.height = `160px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1200);
        }
        rippleContainer.addEventListener('mousedown', createRipple);
        rippleContainer.addEventListener('touchstart', (e) => { createRipple(e); e.preventDefault(); }, { passive: false });

        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];
        function resize() { cBack.width = cFront.width = window.innerWidth; cBack.height = cFront.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.6 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -50) this.reset(false); }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 15; ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 60; i++) particles.push(new Particle());
        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(p.layer === 'front' ? ctxFront : ctxBack); });
            requestAnimationFrame(animate);
        }
        animate();

        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 800 + (i * 1000));
            });
        }
        window.onload = () => setTimeout(startEngraving, 500);
    </script>
</body>
</html>
