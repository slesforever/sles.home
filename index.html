<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            user-select: none;
        }

        /* 背景層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.5)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.8);
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            perspective: 1000px;
        }

        /* 微圓角與微傾斜 UI */
        .ruina-book {
            background: rgba(10, 10, 10, 0.96);
            width: 500px;
            padding: 60px;
            position: relative;
            /* 微圓角設計 */
            border-radius: 15px; 
            /* 微傾斜效果 */
            transform: rotate(-0.8deg);
            /* 金色邊框 */
            border: 2px solid rgba(212, 175, 55, 0.7);
            box-shadow: 
                0 0 40px rgba(0,0,0,0.8),
                inset 0 0 20px rgba(212, 175, 55, 0.1);
        }

        /* 內裝飾線 */
        .ruina-book::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            pointer-events: none;
        }

        h1 {
            font-size: 2.6rem;
            letter-spacing: 14px;
            margin: 0 0 30px 0;
            color: #fff;
            text-align: center;
            opacity: 0;
            transition: all 2s ease;
        }

        .header-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin-bottom: 40px;
            opacity: 0.6;
        }

        .data-row { 
            margin-bottom: 35px; 
            padding-left: 15px;
            border-left: 2px solid rgba(212, 175, 55, 0.15);
        }

        .label {
            font-size: 0.75rem;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 5px;
            opacity: 0.6;
            display: block;
        }

        /* 螢光文字刻印 */
        .value {
            font-size: 1.2rem;
            color: #333; /* 初始深色 */
            line-height: 1.6;
            opacity: 0;
            filter: blur(8px);
            transition: opacity 1.8s ease, filter 1.5s ease, text-shadow 1s ease, color 1.2s ease;
            display: block;
        }

        .value.engraved {
            opacity: 1;
            filter: blur(0px);
            color: #fff;
            text-shadow: 
                0 0 8px rgba(212, 175, 55, 1),
                0 0 15px rgba(212, 175, 55, 0.4);
        }

        h1.engraved {
            opacity: 1;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name">Sles</h1>
            <div class="header-line"></div>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>

            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');

        let particles = [];

        function resize() {
            cBack.width = cFront.width = window.innerWidth;
            cBack.height = cFront.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 2.0 + 0.8; // 保持快速移動
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.65 ? 'front' : 'back';
                this.vx = (Math.random() - 0.5) * 0.5;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.vx;
                if (this.y < -50) this.reset(false);
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => {
                p.update();
                p.draw(p.layer === 'front' ? ctxFront : ctxBack);
            });
            requestAnimationFrame(animate);
        }
        animate();

        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 800 + (i * 900));
            });
        }
        window.onload = () => setTimeout(startEngraving, 500);
    </script>
</body>
</html>
