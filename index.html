<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="https://cdn.fastly.steamstatic.com/steamcommunity/public/images/apps/1256670/207d5c0285aa4319eb1a5006c7b28234c78ed3fe.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles | Library Archive</title>
    <style>
        :root {
            --theme-color: #ffea95;
            --accent-glow: #64ffda;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #010101;
            color: var(--theme-color);
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
        }

        /* 背景圖層 */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('library.jpg');
            background-size: cover; background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 7; pointer-events: none; }

        /* --- 導航鈕：半隱藏設計 --- */
        .page-nav {
            position: fixed;
            top: 50%;
            width: 50px;
            height: 50px;
            border: 2px solid var(--accent-glow);
            background: rgba(100, 255, 218, 0.05);
            cursor: pointer;
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* 左按鈕：藏在視窗外 80% */
        .nav-left {
            left: 0;
            transform: translateY(-50%) translateX(-80%) rotate(45deg);
        }
        .nav-left:hover, .nav-left:active {
            transform: translateY(-50%) translateX(-40%) rotate(45deg);
            background: rgba(100, 255, 218, 0.2);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* 右按鈕：藏在視窗外 80% */
        .nav-right {
            right: 0;
            transform: translateY(-50%) translateX(80%) rotate(45deg);
        }
        .nav-right:hover, .nav-right:active {
            transform: translateY(-50%) translateX(40%) rotate(45deg);
            background: rgba(100, 255, 218, 0.2);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* --- 主容器與 UI 卡片 --- */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 5;
            pointer-events: none; 
        }

        .ruina-book {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 85%;
            max-width: 600px; 
            padding: 60px 40px;
            position: relative;
            border: 1px solid rgba(255, 234, 149, 0.2);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transition: width 0.3s ease;
        }

        /* 關鍵修正：手機版 UI 縮小，防止與菱形碰撞 */
        @media (max-width: 480px) {
            .ruina-book {
                width: 78%; /* 縮窄卡片 */
                padding: 40px 22px; /* 縮小內距 */
            }
            h1 { letter-spacing: 6px !important; font-size: 2.2rem !important; }
            .sub-title { letter-spacing: 2px !important; margin-bottom: 35px !important; }
            
            /* 手機版導航鈕藏更深一點 */
            .nav-left { transform: translateY(-50%) translateX(-85%) rotate(45deg); }
            .nav-right { transform: translateY(-50%) translateX(85%) rotate(45deg); }
        }

        /* 文字樣式 */
        h1 {
            font-size: 3.5rem; letter-spacing: 20px; margin: 0; 
            color: #fff; text-align: center; opacity: 0; font-weight: normal;
        }
        h1.engraved { animation: strong-breath-clear 3.5s infinite ease-in-out; opacity: 1; }

        .sub-title { 
            text-align: center; font-size: 0.65rem; letter-spacing: 8px; 
            color: var(--theme-color); margin: 10px 0 40px 0; opacity: 0; 
        }
        .sub-title.engraved { animation: strong-breath-clear 3.5s infinite ease-in-out; animation-delay: 0.2s; opacity: 1; }

        /* 資料列裝飾線 */
        .data-row { margin-bottom: 30px; position: relative; padding-left: 15px; }
        .data-row::before { 
            content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; 
            background: var(--theme-color); transform: scaleY(0); transition: 0.6s;
            box-shadow: 0 0 10px var(--theme-color);
        }
        .data-row.engraved::before { transform: scaleY(1); }

        .label { font-size: 0.6rem; color: var(--theme-color); margin-bottom: 5px; display: block; opacity: 0.7; }
        .value { font-size: 1.1rem; color: #fff; opacity: 0; display: block; }
        .value.engraved { animation: strong-breath-clear 3.5s infinite ease-in-out; opacity: 1; }

        @keyframes strong-breath-clear {
            0%, 100% { opacity: 0.5; text-shadow: 0 0 5px var(--theme-color); }
            50% { opacity: 1; text-shadow: 0 0 20px var(--theme-color); }
        }

        /* 四角菱形 */
        .corner-diamond {
            position: absolute; width: 8px; height: 8px;
            background: var(--theme-color); transform: rotate(45deg);
        }
        .cd-tl { top: -4px; left: -4px; } .cd-tr { top: -4px; right: -4px; }
        .cd-bl { bottom: -4px; left: -4px; } .cd-br { bottom: -4px; right: -4px; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <!-- 導航鈕 -->
    <div class="page-nav nav-left" id="btn-prev"></div>
    <div class="page-nav nav-right" id="btn-next"></div>

    <div class="main-container">
        <div class="ruina-book" id="ui-card">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>

            <h1 id="title-name">𝑆𝑙𝑒𝑠</h1>
            <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row" id="row-1">
                <span class="label">identity // Ego</span>
                <span class="value">human // developer</span>
            </div>
            <div class="data-row" id="row-2">
                <span class="label">Likes // love</span>
                <span class="value">Develop // novel</span>
            </div>
            <div class="data-row" id="row-3">
                <span class="label">Age // Birthday</span>
                <span class="value">15 // 9/21</span>
            </div>
        </div>
    </div>

    <script>
        // 1. 刻印動畫邏輯
        function startEngraving() {
            setTimeout(() => { document.getElementById('title-name').classList.add('engraved'); }, 100);
            setTimeout(() => { document.getElementById('sub-title').classList.add('engraved'); }, 400);
            const rows = document.querySelectorAll('.data-row');
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    row.querySelector('.value').classList.add('engraved');
                }, 800 + (i * 350));
            });
        }
        
        // 2. 粒子背景特效
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];

        function resize() { 
            cBack.width = cFront.width = window.innerWidth; 
            cBack.height = cFront.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 1.2 + 0.8;   
                this.opacity = Math.random() * 0.5;
                this.layer = Math.random() > 0.6 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -50) this.reset(false); }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 234, 149, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(p.layer === 'front' ? ctxFront : ctxBack); });
            requestAnimationFrame(animate);
        }

        window.onload = () => {
            animate();
            startEngraving();
        };

        // 導航測試
        document.getElementById('btn-prev').onclick = () => console.log("Prev Page");
        document.getElementById('btn-next').onclick = () => console.log("Next Page");
    </script>
    <script src="music_module.js"></script>
</body>
</html>
