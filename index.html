<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        :root {
            --theme-color: #ffea95;
            --accent-glow: #64ffda; /* 核心青藍色光芒 */
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #010101;
            color: var(--theme-color);
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('library.jpg');
            background-size: cover;
            background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            pointer-events: none; 
        }

        /* 核心 UI 容器 */
        .ruina-book {
            pointer-events: auto;
            background: radial-gradient(circle at 50% 50%, rgba(20, 25, 35, 0.95), rgba(10, 10, 10, 0.98));
            backdrop-filter: blur(25px) saturate(140%);
            -webkit-backdrop-filter: blur(25px) saturate(140%);
            width: 90%;
            max-width: 720px; 
            min-height: 500px;
            padding: 90px 70px;
            position: relative;
            border: 1px solid rgba(255, 234, 149, 0.15);
            box-shadow: 0 0 100px rgba(0,0,0,1), inset 0 0 40px rgba(255, 234, 149, 0.05);
        }

        /* 滑鼠追蹤高亮 */
        .ruina-book::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(255, 234, 149, 0.06), transparent 40%);
            z-index: -1;
        }

        /* --- 華麗裝飾組件 --- */
        
        /* 四角金色飾紋 (SVG) */
        .ornament-corner {
            position: absolute;
            width: 80px; height: 80px;
            fill: none;
            stroke: var(--theme-color);
            stroke-width: 1.5;
            opacity: 0.8;
            filter: drop-shadow(0 0 5px var(--theme-color));
        }
        .oc-tl { top: 10px; left: 10px; }
        .oc-tr { top: 10px; right: 10px; transform: scaleX(-1); }
        .oc-bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
        .oc-br { bottom: 10px; right: 10px; transform: scale(-1); }

        /* 中央對稱飾紋 (上下) */
        .ornament-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            fill: var(--theme-color);
            opacity: 0.7;
        }
        .oct { top: 15px; }
        .ocb { bottom: 15px; transform: translateX(-50%) scaleY(-1); }

        /* 左側發光核心 - 光之種標誌 */
        .seed-logo {
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 120px;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 0 20px var(--accent-glow));
            opacity: 0;
            transition: 2s ease;
        }
        .seed-logo.engraved { opacity: 1; }

        /* --- 文字與排版 --- */

        .header-section {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .the-book-of {
            font-size: 0.9rem;
            letter-spacing: 12px;
            color: var(--theme-color);
            opacity: 0.6;
            margin-bottom: 15px;
            display: block;
        }

        h1 {
            font-size: 4.5rem;
            letter-spacing: 35px;
            margin: 0;
            color: #fff;
            text-align: center;
            font-weight: normal;
            text-transform: uppercase;
            filter: drop-shadow(0 0 15px var(--theme-color));
        }

        .sub-title {
            font-size: 0.7rem;
            letter-spacing: 10px;
            color: var(--theme-color);
            margin-top: 20px;
            opacity: 0.4;
            border-top: 1px solid rgba(255, 234, 149, 0.2);
            padding-top: 15px;
            display: inline-block;
        }

        .data-row { margin-bottom: 40px; position: relative; padding-left: 25px; }
        .data-row::before { 
            content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; 
            background: var(--theme-color); transform: scaleY(0); transition: 0.8s;
            box-shadow: 0 0 15px var(--theme-color);
        }
        .data-row.engraved::before { transform: scaleY(1); }

        .label { font-size: 0.65rem; color: var(--theme-color); margin-bottom: 10px; letter-spacing: 4px; display: block; opacity: 0.7; }
        .value { font-size: 1.3rem; color: #fff; opacity: 0; transition: 1.5s; display: block; }

        /* 動畫觸發 */
        @keyframes glow-breath {
            0%, 100% { filter: drop-shadow(0 0 10px var(--theme-color)); opacity: 0.7; }
            50% { filter: drop-shadow(0 0 25px #fff); opacity: 1; }
        }
        .engraved .value { opacity: 1; text-shadow: 0 0 10px var(--theme-color); }
        .ornament-center { animation: glow-breath 4s infinite ease-in-out; }

        /* 點擊特效 */
        .ripple {
            position: absolute; border-radius: 50%; pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border: 1px solid var(--accent-glow);
            box-shadow: 0 0 15px var(--accent-glow);
            animation: ripple-fast 0.4s ease-out forwards;
        }
        @keyframes ripple-fast { from { transform: translate(-50%, -50%) scale(0); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99; pointer-events:auto;"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <!-- 光之種 Logo (左側) -->
        <div class="seed-logo" id="seed-logo">
            <svg viewBox="0 0 100 120">
                <path d="M50 10 L90 50 L50 90 L10 50 Z" fill="none" stroke="#64ffda" stroke-width="2" />
                <path d="M50 25 L75 50 L50 75 L25 50 Z" fill="#64ffda" opacity="0.6" />
                <path d="M50 0 L55 45 L100 50 L55 55 L50 100 L45 55 L0 50 L45 45 Z" fill="#ffea95" opacity="0.3" />
            </svg>
        </div>

        <div class="ruina-book" id="ui-card">
            <!-- 四角 SVG 飾紋 -->
            <svg class="ornament-corner oc-tl" viewBox="0 0 100 100"><path d="M5,40 V5 H40 M15,30 V15 H30 M25,25 V20 H20" /></svg>
            <svg class="ornament-corner oc-tr" viewBox="0 0 100 100"><path d="M5,40 V5 H40 M15,30 V15 H30 M25,25 V20 H20" /></svg>
            <svg class="ornament-corner oc-bl" viewBox="0 0 100 100"><path d="M5,40 V5 H40 M15,30 V15 H30 M25,25 V20 H20" /></svg>
            <svg class="ornament-corner oc-br" viewBox="0 0 100 100"><path d="M5,40 V5 H40 M15,30 V15 H30 M25,25 V20 H20" /></svg>

            <!-- 上下中央飾紋 -->
            <svg class="ornament-center oct" viewBox="0 0 200 30">
                <path d="M0,15 H70 L100,5 L130,15 H200 M90,15 L100,25 L110,15" fill="none" stroke="#ffea95" stroke-width="1"/>
                <circle cx="100" cy="5" r="2" />
            </svg>
            <svg class="ornament-center ocb" viewBox="0 0 200 30">
                <path d="M0,15 H70 L100,5 L130,15 H200 M90,15 L100,25 L110,15" fill="none" stroke="#ffea95" stroke-width="1"/>
                <circle cx="100" cy="5" r="2" />
            </svg>

            <div class="header-section">
                <span class="the-book-of">THE BOOK OF</span>
                <h1 id="title-name">SLES</h1>
                <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            </div>
            
            <div class="data-row" id="row-1">
                <span class="label">IDENTITY // 身份</span>
                <span class="value">開發者 / 創作編劇</span>
            </div>
            <div class="data-row" id="row-2">
                <span class="label">STATUS // 狀態</span>
                <span class="value">正在編寫「情緒與救贖」的檔案。</span>
            </div>
            <div class="data-row" id="row-3">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value">Project Moon Archive / Roblox Studio</span>
            </div>
        </div>
    </div>

    <script>
        const uiCard = document.getElementById('ui-card');
        document.addEventListener('mousemove', (e) => {
            const rect = uiCard.getBoundingClientRect();
            uiCard.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            uiCard.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        const rippleContainer = document.getElementById('ripple-container');
        rippleContainer.addEventListener('mousedown', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = `120px`;
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        });

        // 畫布粒子邏輯
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];
        function resize() { cBack.width = cFront.width = window.innerWidth; cBack.height = cFront.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 100;
                this.radius = Math.random() * 2 + 1;
                this.speedY = Math.random() * 2 + 1.5;   
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.7 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -100) this.reset(false); }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 15; ctx.shadowColor = '#ffea95';
                ctx.fillStyle = `rgba(255, 234, 149, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 40; i++) particles.push(new Particle());
        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(p.layer === 'front' ? ctxFront : ctxBack); });
            requestAnimationFrame(animate);
        }
        animate();

        // 刻印起動
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('seed-logo').classList.add('engraved');
                document.getElementById('title-name').style.opacity = '1';
                const rows = document.querySelectorAll('.data-row');
                rows.forEach((row, i) => {
                    setTimeout(() => row.classList.add('engraved'), 600 + (i * 500));
                });
            }, 300);
        };
    </script>
</body>
</html>
