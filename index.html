<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #010101;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
        }

        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('library.jpg');
            background-size: cover;
            background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            pointer-events: none; 
        }

        .ruina-book {
            pointer-events: auto;
            background: rgba(12, 12, 12, 0.7);
            backdrop-filter: blur(25px) saturate(130%);
            -webkit-backdrop-filter: blur(25px) saturate(130%);
            width: 90%;
            max-width: 720px; 
            padding: 65px 60px;
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 60px rgba(0,0,0,1);
        }

        /* 護角 */
        .corner-diamond {
            position: absolute;
            width: 12px; height: 12px;
            background: #d4af37;
            transform: rotate(45deg);
            box-shadow: 0 0 15px #d4af37;
            z-index: 10;
        }
        .cd-tl { top: -6px; left: -6px; }
        .cd-tr { top: -6px; right: -6px; }
        .cd-bl { bottom: -6px; left: -6px; }
        .cd-br { bottom: -6px; right: -6px; }

        /* SLES 專屬：保持原本的高頻率不穩定感 */
        h1 {
            font-size: 4rem;
            letter-spacing: 28px;
            margin: 0;
            color: #fff;
            text-align: center;
            opacity: 0;
            font-weight: normal;
        }
        h1.engraved {
            opacity: 1;
            animation: pulsing-glow-sles 0.4s infinite alternate ease-in-out;
        }
        @keyframes pulsing-glow-sles {
            0% { text-shadow: 0 0 10px #d4af37, 0 0 20px #d4af37; transform: scale(1); }
            100% { text-shadow: 0 0 20px #fff, 0 0 50px #d4af37, 0 0 80px rgba(212, 175, 55, 0.8); transform: scale(1.01); }
        }

        /* 全體閃爍呼吸動畫 (週期較長) */
        @keyframes slow-breath {
            0% { opacity: 0.4; filter: blur(1px); text-shadow: 0 0 5px rgba(212, 175, 55, 0.2); }
            50% { opacity: 1; filter: blur(0px); text-shadow: 0 0 15px rgba(212, 175, 55, 0.8); }
            100% { opacity: 0.4; filter: blur(1px); text-shadow: 0 0 5px rgba(212, 175, 55, 0.2); }
        }

        .sub-title { 
            text-align: center; font-size: 0.75rem; letter-spacing: 12px; color: #d4af37; 
            margin: 15px 0 60px 0; opacity: 0; 
        }
        .sub-title.engraved {
            animation: slow-breath 4s infinite ease-in-out;
        }

        .data-row { margin-bottom: 45px; position: relative; padding-left: 20px; }
        .data-row::before { 
            content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; 
            background: #d4af37; transform: scaleY(0); transition: 0.5s;
            box-shadow: 0 0 10px #d4af37;
        }
        .data-row.engraved::before { transform: scaleY(1); }

        .label { font-size: 0.7rem; color: #d4af37; margin-bottom: 12px; letter-spacing: 5px; display: block; }
        .value { font-size: 1.4rem; color: #fff; opacity: 0; filter: blur(10px); display: block; }

        /* 這裡控制資料行的呼吸 */
        .value.engraved {
            animation: slow-breath 3.5s infinite ease-in-out;
        }
        #row-2 .value.engraved { animation-delay: 0.5s; }
        #row-3 .value.engraved { animation-delay: 1s; }

        /* 縮小範圍的波紋 */
        #ripple-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; pointer-events: auto; }
        .ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0); }
        .ripple-1 { 
            border: 2px solid #d4af37; 
            background: radial-gradient(circle, rgba(212,175,55,0.4) 0%, transparent 70%); 
            animation: ripple-fast 0.4s ease-out forwards; 
            box-shadow: 0 0 15px #d4af37;
        }
        @keyframes ripple-fast { 
            from { transform: translate(-50%, -50%) scale(0); opacity: 1; } 
            to { transform: translate(-50%, -50%) scale(1.2); opacity: 0; } 
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>

            <h1 id="title-name">SLES</h1>
            <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row" id="row-1">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="val-1">開發者 / 創作編劇</span>
            </div>
            <div class="data-row" id="row-2">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="val-2">在此處整理著散落的記憶與光芒。</span>
            </div>
            <div class="data-row" id="row-3">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="val-3">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        const rippleContainer = document.getElementById('ripple-container');
        function createRipple(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (!x || !y) return;
            const ripple = document.createElement('div');
            ripple.className = 'ripple ripple-1';
            ripple.style.width = ripple.style.height = `100px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);
        }
        rippleContainer.addEventListener('mousedown', createRipple);

        // 粒子系統
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];
        function resize() { cBack.width = cFront.width = window.innerWidth; cBack.height = cFront.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 2 + 1;
                this.speedY = Math.random() * 1.5 + 1;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.7 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -50) this.reset(false); }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 10; ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 50; i++) particles.push(new Particle());
        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(p.layer === 'front' ? ctxFront : ctxBack); });
            requestAnimationFrame(animate);
        }
        animate();

        // 啟動動畫
        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            setTimeout(() => document.getElementById('sub-title').classList.add('engraved'), 400);
            
            const rows = document.querySelectorAll('.data-row');
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    row.querySelector('.value').classList.add('engraved');
                }, 800 + (i * 400));
            });
        }
        window.onload = () => setTimeout(startEngraving, 300);
    </script>
</body>
</html>
