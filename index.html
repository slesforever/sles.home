<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            user-select: none;
        }

        /* 背景層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.8) contrast(1.1);
        }

        /* 特效層 */
        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
        }

        /* Ruina 特色酷邊框 UI */
        .ruina-book {
            background: rgba(8, 8, 8, 0.94);
            width: 500px;
            padding: 65px 55px;
            position: relative;
            /* 複雜的不規則幾何形狀 */
            clip-path: polygon(0% 15%, 15% 0%, 85% 0%, 100% 10%, 100% 85%, 85% 100%, 15% 100%, 0% 90%, 5% 50%);
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 60px rgba(0,0,0,1);
        }

        /* 第二層裝飾邊框 - 營造層次感 */
        .ruina-book::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            clip-path: polygon(0% 12%, 12% 0%, 88% 0%, 100% 12%, 100% 88%, 88% 100%, 12% 100%, 0% 88%);
            pointer-events: none;
        }

        /* 角落裝飾點 */
        .ruina-book::after {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            background: 
                radial-gradient(circle at 15% 15%, #d4af37 2px, transparent 2px),
                radial-gradient(circle at 85% 85%, #d4af37 2px, transparent 2px);
            opacity: 0.5;
            pointer-events: none;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 15px;
            margin: 0 0 45px 0;
            color: #fff;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0);
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            display: inline-block;
            opacity: 0;
            transition: all 2.5s ease;
        }

        .data-row { margin-bottom: 35px; border-left: 1px solid rgba(212, 175, 55, 0.2); padding-left: 20px; }

        .label {
            font-size: 0.75rem;
            color: #d4af37;
            margin-bottom: 10px;
            letter-spacing: 5px;
            opacity: 0.6;
            display: block;
            font-weight: bold;
        }

        .value {
            font-size: 1.25rem;
            color: #efefef;
            line-height: 1.6;
            opacity: 0;
            filter: blur(10px);
            transition: opacity 1.8s ease, filter 1.5s ease, text-shadow 1.2s ease;
        }

        .value.engraved {
            opacity: 1;
            filter: blur(0px);
            text-shadow: 0 0 12px rgba(212, 175, 55, 1), 0 0 25px rgba(212, 175, 55, 0.5);
        }

        h1.engraved { opacity: 1; text-shadow: 0 0 20px rgba(212, 175, 55, 0.9); }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name">Sles</h1>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>

            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');

        let particles = [];

        function resize() {
            cBack.width = cFront.width = window.innerWidth;
            cBack.height = cFront.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                // 初始分布在全螢幕，之後只從底部產生
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 4 + 1.5;
                this.speedY = Math.random() * 1.5 + 0.5; // 加快移動速度
                this.opacity = Math.random() * 0.6 + 0.2;
                this.layer = Math.random() > 0.7 ? 'front' : 'back';
                this.vx = (Math.random() - 0.5) * 0.5; // 微弱的水平飄移
            }
            update() {
                this.y -= this.speedY;
                this.x += this.vx;
                
                // 循環檢查：如果超出螢幕頂部，立即重設到底部
                if (this.y < -50) {
                    this.reset(false);
                }
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);

            particles.forEach(p => {
                p.update();
                p.draw(p.layer === 'front' ? ctxFront : ctxBack);
            });
            requestAnimationFrame(animate);
        }
        animate();

        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 1200 + (i * 1000));
            });
        }
        window.onload = () => setTimeout(startEngraving, 600);
    </script>
</body>
</html>
