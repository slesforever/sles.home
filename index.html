<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #010101;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
        }

        /* 背景：深邃光影 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.6)), url('library.jpg');
            background-size: cover;
            background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            pointer-events: none; 
        }

        /* 微調後的長方形 UI 本體 */
        .ruina-book {
            pointer-events: auto;
            background: rgba(12, 12, 12, 0.7); /* 半透明度增加 */
            backdrop-filter: blur(25px) saturate(130%);
            -webkit-backdrop-filter: blur(25px) saturate(130%);
            
            /* 左右微調長一點 */
            width: 90%;
            max-width: 720px; 
            padding: 70px 60px;
            
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 
                0 0 60px rgba(0,0,0,1),
                inset 0 0 30px rgba(212, 175, 55, 0.05);
        }

        /* 燙金菱形護角 */
        .corner-diamond {
            position: absolute;
            width: 14px; height: 14px;
            background: #d4af37;
            transform: rotate(45deg);
            box-shadow: 0 0 20px #d4af37;
            z-index: 10;
        }
        .cd-tl { top: -7px; left: -7px; }
        .cd-tr { top: -7px; right: -7px; }
        .cd-bl { bottom: -7px; left: -7px; }
        .cd-br { bottom: -7px; right: -7px; }

        .top-divider {
            position: absolute;
            top: 25px; left: 50%;
            transform: translateX(-50%);
            width: 300px; height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }

        /* 加強版：SLES 暴力螢光漸顯 */
        h1 {
            font-size: 4rem; /* 稍微放大 */
            letter-spacing: 28px;
            margin: 0;
            color: #fff;
            text-align: center;
            opacity: 0;
            font-weight: normal;
        }

        h1.engraved {
            animation: aggressive-neon 3s cubic-bezier(0.2, 1, 0.2, 1) forwards;
        }

        @keyframes aggressive-neon {
            0% {
                opacity: 0;
                filter: blur(15px);
                text-shadow: 0 0 0px #fff;
            }
            30% {
                opacity: 0.8;
                text-shadow: 0 0 10px #fff, 0 0 30px #d4af37, 0 0 50px #d4af37;
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                /* 多層疊加發光 */
                text-shadow: 
                    0 0 10px #fff, 
                    0 0 25px #d4af37, 
                    0 0 50px #d4af37, 
                    0 0 80px rgba(212, 175, 55, 0.6);
            }
        }

        /* 副標題與資料行 */
        .sub-title { text-align: center; font-size: 0.75rem; letter-spacing: 12px; color: #d4af37; margin: 15px 0 60px 0; opacity: 0.7; }
        
        .data-row { margin-bottom: 45px; position: relative; padding-left: 20px; }
        .data-row::before { 
            content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%; 
            background: #d4af37; transform: scaleY(0); transition: 1.2s; 
            box-shadow: 0 0 10px #d4af37;
        }
        .data-row.engraved::before { transform: scaleY(1); }
        
        .label { font-size: 0.7rem; color: #d4af37; margin-bottom: 12px; letter-spacing: 5px; display: block; }
        .value { font-size: 1.4rem; color: #fff; opacity: 0; filter: blur(10px); transition: 2s; display: block; }
        .value.engraved { opacity: 1; filter: blur(0px); text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }

        /* 波紋：顏色加深 */
        #ripple-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; pointer-events: auto; }
        .ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0); }
        .ripple-1 { 
            border: 1.5px solid #d4af37; 
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 80%); 
            animation: ripple-out 0.8s ease-out forwards; 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }
        @keyframes ripple-out { from { transform: translate(-50%, -50%) scale(0); opacity: 1; } to { transform: translate(-50%, -50%) scale(2.6); opacity: 0; } }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>
            <div class="top-divider"></div>

            <h1 id="title-name">SLES</h1>
            <div class="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>
            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>
            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        // 雙重波紋與粒子邏輯保持不變，但調強了光感
        const rippleContainer = document.getElementById('ripple-container');
        function createRipple(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (!x || !y) return;
            const ripple = document.createElement('div');
            ripple.className = 'ripple ripple-1';
            ripple.style.width = ripple.style.height = `220px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        }
        rippleContainer.addEventListener('mousedown', createRipple);
        rippleContainer.addEventListener('touchstart', (e) => { createRipple(e); e.preventDefault(); }, { passive: false });

        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];
        function resize() { cBack.width = cFront.width = window.innerWidth; cBack.height = cFront.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 2 + 0.8;
                this.speedY = Math.random() * 0.8 + 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.layer = Math.random() > 0.7 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -50) this.reset(false); }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 12; ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 45; i++) particles.push(new Particle());
        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(p.layer === 'front' ? ctxFront : ctxBack); });
            requestAnimationFrame(animate);
        }
        animate();

        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const rows = document.querySelectorAll('.data-row');
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    row.querySelector('.value').classList.add('engraved');
                }, 1200 + (i * 900));
            });
        }
        window.onload = () => setTimeout(startEngraving, 600);
    </script>
</body>
</html>
