<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* 背景層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('library.jpg');
            background-size: cover;
            background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 5; pointer-events: none; }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4;
            pointer-events: none; 
        }

        /* 強化質感的 UI 本體 */
        .ruina-book {
            pointer-events: auto;
            background: rgba(12, 12, 12, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 85%;
            max-width: 620px;
            padding: 80px 50px;
            position: relative;
            /* 金屬質感邊框漸層 */
            border: 2px solid;
            border-image: linear-gradient(135deg, #d4af37 0%, #f9e1a0 50%, #b38a2d 100%) 1;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            transform: rotate(-0.2deg);
        }

        /* 內側第二層裝飾線 */
        .ruina-book::after {
            content: "";
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
        }

        /* 精緻金屬護角 */
        .corner {
            position: absolute;
            width: 50px; height: 50px;
            border: 3px solid #d4af37;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .tl { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .tr { top: -5px; right: -5px; border-left: none; border-bottom: none; }
        .bl { bottom: -5px; left: -5px; border-right: none; border-top: none; }
        .br { bottom: -5px; right: -5px; border-left: none; border-top: none; }

        /* 頂部裝飾點 */
        .top-crown {
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            background: #d4af37;
            padding: 5px 25px;
            font-size: 0.6rem;
            color: #000;
            font-weight: bold;
            letter-spacing: 5px;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        }

        /* 霓虹波紋 */
        #ripple-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; pointer-events: auto; }
        .ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0); }
        .ripple-1 {
            border: 1px solid #d4af37;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 75%);
            animation: ripple-out-1 0.7s ease-out forwards;
            box-shadow: 0 0 20px #d4af37;
        }
        .ripple-2 {
            border: 1px solid rgba(212, 175, 55, 0.5);
            animation: ripple-out-2 0.9s ease-out 0.1s forwards;
        }
        @keyframes ripple-out-1 { from { transform: translate(-50%, -50%) scale(0); opacity: 1; } to { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } }
        @keyframes ripple-out-2 { from { transform: translate(-50%, -50%) scale(0); opacity: 0.6; } to { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }

        /* 文字樣式 */
        h1 { font-size: 3rem; letter-spacing: 16px; margin: 0; color: #fff; text-align: center; opacity: 0; }
        .sub-title { text-align: center; font-size: 0.75rem; letter-spacing: 10px; color: #d4af37; margin: 15px 0 50px 0; opacity: 0.7; font-weight: bold; }
        .data-row { margin-bottom: 40px; border-left: 2px solid rgba(212, 175, 55, 0.4); padding-left: 25px; transition: 0.3s; }
        .label { font-size: 0.7rem; color: #d4af37; margin-bottom: 8px; letter-spacing: 4px; display: block; }
        .value { font-size: 1.3rem; color: #333; opacity: 0; filter: blur(10px); transition: 2s; display: block; }
        .value.engraved { opacity: 1; filter: blur(0px); color: #efefef; text-shadow: 0 0 10px #d4af37; }
        h1.engraved { opacity: 1; text-shadow: 0 0 25px #d4af37; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container"></div>
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <!-- 四角與飾徽 -->
            <div class="corner tl"></div><div class="corner tr"></div>
            <div class="corner bl"></div><div class="corner br"></div>
            <div class="top-crown">LIBRARIAN</div>

            <h1 id="title-name">Sles</h1>
            <div class="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>
            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>
            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        const rippleContainer = document.getElementById('ripple-container');
        function createRipple(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (!x || !y) return;
            addRippleElement(x, y, 'ripple-1');
            addRippleElement(x, y, 'ripple-2');
        }
        function addRippleElement(x, y, className) {
            const ripple = document.createElement('div');
            ripple.className = `ripple ${className}`;
            ripple.style.width = ripple.style.height = `160px`;
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        }
        rippleContainer.addEventListener('mousedown', createRipple);
        rippleContainer.addEventListener('touchstart', (e) => { createRipple(e); e.preventDefault(); }, { passive: false });

        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];
        function resize() { cBack.width = cFront.width = window.innerWidth; cBack.height = cFront.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 50;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.5 + 1.0;
                this.opacity = Math.random() * 0.4 + 0.15;
                this.layer = Math.random() > 0.6 ? 'front' : 'back';
            }
            update() { this.y -= this.speedY; if (this.y < -50) this.reset(false); }
            draw(ctx) {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 15; ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < 65; i++) particles.push(new Particle());
        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => { p.update(); p.draw(p.layer === 'front' ? ctxFront : ctxBack); });
            requestAnimationFrame(animate);
        }
        animate();

        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 800 + (i * 900));
            });
        }
        window.onload = () => setTimeout(startEngraving, 500);
    </script>
</body>
</html>
