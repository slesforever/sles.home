<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #d4af37;
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 背景圖層 - 強化穩定性 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* 預備背景：即使 library.jpg 失敗，也不會是一片死黑 */
            background-color: #1a1005; /* 深古銅色 */
            background-image: 
                linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(26,16,5,0.6)),
                url('library.jpg'); /* 你上傳圖片後會自動讀取 */
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            /* 調整濾鏡，讓圖片更神祕，但不過暗 */
            filter: brightness(0.5) contrast(1.1) sepia(0.2);
            z-index: -3; /* 最底層 */
            transition: background 1s ease, filter 1s ease;
        }

        /* 特效畫布層 */
        #effect-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2; /* 在背景圖之上，UI 之下 */
            pointer-events: none;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            z-index: 1; /* 確保 UI 在最前 */
        }

        /* 仿 Library of Ruina 書頁 UI */
        .ruina-book {
            background: rgba(10, 10, 10, 0.88);
            width: 450px;
            padding: 50px 40px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(212, 175, 55, 0.2);
            position: relative;
            clip-path: polygon(0 40px, 40px 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%);
            animation: fadeIn 1.5s ease-out;
        }

        /* 內部裝飾線 */
        .ruina-book::after {
            content: "";
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            pointer-events: none;
            clip-path: polygon(0 35px, 35px 0, 100% 0, 100% calc(100% - 35px), calc(100% - 35px) 100%, 0 100%);
        }

        h1 {
            text-align: center;
            font-size: 2.6rem;
            letter-spacing: 10px;
            margin: 0 0 35px 0;
            color: #fff;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
            font-weight: 300;
        }

        .data-content {
            position: relative;
            z-index: 2;
        }

        .data-row {
            margin-bottom: 25px;
            padding-left: 15px;
            border-left: 3px solid #d4af37;
        }

        .label {
            font-size: 0.75rem;
            color: #d4af37;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        .value {
            font-size: 1.15rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 這裡調整了圖層順序，確保特效不被覆蓋 -->
    <div class="bg-layer"></div>
    <canvas id="effect-canvas"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <div class="data-content">
                <h1>Sles</h1>
                
                <div class="data-row">
                    <span class="label">IDENTITY</span>
                    <span class="value">開發者 / 創作編劇</span>
                </div>

                <div class="data-row">
                    <span class="label">STATUS</span>
                    <span class="value">接待準備中。此處保存著無數的記憶與光芒。</span>
                </div>

                <div class="data-row">
                    <span class="label">COLLECTION</span>
                    <span class="value">Project Moon Archive<br>Roblox Combat Script</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入外部特效腳本 -->
    <script src="effects.js"></script>
</body>
</html>
