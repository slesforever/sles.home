<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #0a0a0a;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            user-select: none;
        }

        /* 背景：調高亮度，讓圖片清晰可見 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.7) contrast(1.1); /* 提高亮度 */
        }

        #effect-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 3;
        }

        /* Ruina 特色：不規則稜角 UI */
        .ruina-book {
            background: rgba(10, 10, 10, 0.92);
            width: 480px;
            padding: 60px 50px;
            position: relative;
            /* 故意做成不對稱的斜角 */
            clip-path: polygon(5% 0%, 100% 0%, 95% 95%, 0% 100%, 2% 15%);
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* 內部裝飾線：與外框錯開，增加不規則感 */
        .ruina-book::before {
            content: "";
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            clip-path: polygon(0% 10%, 90% 0%, 100% 90%, 10% 100%);
            pointer-events: none;
        }

        h1 {
            text-align: left;
            font-size: 2.4rem;
            letter-spacing: 10px;
            margin: 0 0 40px 0;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            border-bottom: 2px solid #d4af37;
            display: inline-block;
        }

        .data-row {
            margin-bottom: 35px;
        }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            margin-bottom: 10px;
            letter-spacing: 4px;
            opacity: 0.6;
            display: block;
            font-weight: bold;
        }

        .value {
            font-size: 1.15rem;
            color: #d0d0d0;
            line-height: 1.8;
            min-height: 1.5em;
            display: inline-block;
            text-shadow: 1px 1px 2px rgba(0,0,0,1);
        }

        /* 經典游標 */
        .cursor {
            display: inline-block;
            width: 7px;
            height: 1.2rem;
            background: #d4af37;
            margin-left: 5px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <canvas id="effect-canvas"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name"></h1>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity"></span>
            </div>

            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status"></span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection"></span>
            </div>
        </div>
    </div>

    <script>
        // --- 特效：圓形光點粒子 ---
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.radius = Math.random() * 4 + 1; // 圓形大小
                this.speedY = Math.random() * 0.8 + 0.2;
                this.opacity = Math.random() * 0.6 + 0.1;
                this.drift = Math.sin(Math.random() * 6); // 左右飄移
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y / 50) * 0.5; // 蛇行飄動
                if (this.y < -50 || this.opacity <= 0) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 特效：打字機 ---
        const content = [
            { id: 'title-name', text: 'Sles' },
            { id: 'text-identity', text: '開發者 / 創作編劇' },
            { id: 'text-status', text: '在此處整理著散落的記憶與光芒。' },
            { id: 'text-collection', text: 'Project Moon Archive / Roblox Logic' }
        ];

        async function typeWriter(id, text, speed = 90) {
            const element = document.getElementById(id);
            element.innerHTML = '<span class="cursor"></span>';
            const cursor = element.querySelector('.cursor');

            for (let i = 0; i < text.length; i++) {
                cursor.insertAdjacentHTML('beforebegin', text.charAt(i));
                await new Promise(res => setTimeout(res, speed + Math.random() * 40));
            }
            cursor.style.display = 'none'; // 完成後隱藏游標
        }

        async function startSequentially() {
            for (const item of content) {
                await typeWriter(item.id, item.text);
                await new Promise(res => setTimeout(res, 400));
            }
        }

        setTimeout(startSequentially, 800);
    </script>
</body>
</html>
