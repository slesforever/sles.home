<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="https://cdn.fastly.steamstatic.com/steamcommunity/public/images/apps/1256670/207d5c0285aa4319eb1a5006c7b28234c78ed3fe.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sles | Library Archive</title>
    <style>
        :root {
            --theme-color: #ffea95;
            --accent-glow: #64ffda;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #010101;
            color: var(--theme-color);
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            touch-action: none;
        }

        /* --- 背景圖層 --- */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('library.jpg');
            background-size: cover;
            background-position: center;
        }

        #canvas-back { position: fixed; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #canvas-front { position: fixed; top: 0; left: 0; z-index: 7; pointer-events: none; }

        /* --- 導航按鈕：極致半隱藏設計 --- */
        .page-nav {
            position: fixed;
            top: 50%;
            width: clamp(45px, 12vw, 70px);
            height: clamp(45px, 12vw, 70px);
            border: 2px solid var(--accent-glow);
            background: rgba(100, 255, 218, 0.05);
            cursor: pointer;
            z-index: 100;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        /* 左按鈕 */
        .nav-left {
            left: 0;
            transform: translateY(-50%) translateX(-75%) rotate(45deg);
        }
        .nav-left:hover, .nav-left:active {
            transform: translateY(-50%) translateX(-40%) rotate(45deg);
            background: rgba(100, 255, 218, 0.2);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        /* 右按鈕 */
        .nav-right {
            right: 0;
            transform: translateY(-50%) translateX(75%) rotate(45deg);
        }
        .nav-right:hover, .nav-right:active {
            transform: translateY(-50%) translateX(40%) rotate(45deg);
            background: rgba(100, 255, 218, 0.2);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .page-nav::before {
            content: "";
            width: 25%;
            height: 25%;
            background: var(--accent-glow);
            filter: blur(4px);
            opacity: 0.5;
        }

        /* --- 主容器與 UI 卡片 --- */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 5;
            pointer-events: none; 
        }

        .ruina-book {
            pointer-events: auto;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            width: 90%;
            max-width: 650px; 
            padding: clamp(35px, 10vh, 70px) clamp(20px, 5vw, 60px);
            position: relative;
            border: 1px solid rgba(255, 234, 149, 0.15);
            box-shadow: 0 0 80px rgba(0,0,0,1);
            max-height: 85vh;
            overflow: hidden;
        }

        /* 滑鼠發光效果 */
        .ruina-book::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(255, 234, 149, 0.05), transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        /* 四角菱形裝飾 */
        .corner-diamond {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--theme-color);
            transform: rotate(45deg);
            box-shadow: 0 0 12px var(--theme-color);
            z-index: 12;
        }
        .cd-tl { top: -5px; left: -5px; }
        .cd-tr { top: -5px; right: -5px; }
        .cd-bl { bottom: -5px; left: -5px; }
        .cd-br { bottom: -5px; right: -5px; }

        /* --- 文字動畫 --- */
        @keyframes strong-breath-clear {
            0%, 100% { opacity: 0.4; text-shadow: 0 0 5px var(--theme-color); }
            50% { opacity: 1; text-shadow: 0 0 15px #fff, 0 0 25px var(--theme-color); }
        }

        h1 {
            font-size: clamp(2.4rem, 12vw, 3.8rem); 
            letter-spacing: clamp(10px, 5vw, 25px); 
            margin: 0;
            color: #fff;
            text-align: center;
            opacity: 0;
            font-weight: normal;
        }
        h1.engraved {
            animation: strong-breath-clear 3.5s infinite ease-in-out;
            opacity: 1;
        }

        .sub-title { 
            text-align: center;
            font-size: clamp(0.55rem, 2vw, 0.7rem); 
            letter-spacing: clamp(3px, 2vw, 10px);
            color: var(--theme-color); 
            margin: 10px 0 clamp(30px, 8vh, 55px) 0;
            opacity: 0; 
        }
        .sub-title.engraved {
            animation: strong-breath-clear 3.5s infinite ease-in-out;
            animation-delay: 0.2s;
            opacity: 1;
        }

        /* --- 資料行佈局 --- */
        .data-row {
            margin-bottom: clamp(20px, 6vh, 40px);
            position: relative;
            padding-left: 18px;
        }
        .data-row::before { 
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 2px;
            height: 100%; 
            background: var(--theme-color);
            transform: scaleY(0);
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--theme-color);
        }
        .data-row.engraved::before { transform: scaleY(1); }

        .label {
            font-size: 0.6rem;
            color: var(--theme-color);
            margin-bottom: 6px;
            letter-spacing: 2px;
            display: block;
            opacity: 0.7;
        }
        .value {
            font-size: clamp(0.95rem, 4vw, 1.2rem);
            color: #fff;
            opacity: 0;
            display: block;
        }
        .value.engraved {
            animation: strong-breath-clear 3.5s infinite ease-in-out;
            opacity: 1;
        }

        /* --- 點擊波紋 --- */
        .ripple {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border: 1px solid var(--accent-glow);
            box-shadow: 0 0 15px var(--accent-glow);
            animation: ripple-ultra-fast 0.35s ease-out forwards;
        }
        @keyframes ripple-ultra-fast {
            from { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            to { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }

        /* 手機版微調：修正空間與按鈕 */
        @media (max-width: 480px) {
            .ruina-book { width: 78%; } /* 寬度微調以容納菱形按鈕 */
            h1 { letter-spacing: 8px; }
            .nav-left { transform: translateY(-50%) translateX(-85%) rotate(45deg); }
            .nav-right { transform: translateY(-50%) translateX(85%) rotate(45deg); }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="ripple-container" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99; pointer-events:auto;"></div>
    
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="page-nav nav-left" id="btn-prev"></div>
    <div class="page-nav nav-right" id="btn-next"></div>

    <div class="main-container">
        <div class="ruina-book" id="ui-card">
            <div class="corner-diamond cd-tl"></div><div class="corner-diamond cd-tr"></div>
            <div class="corner-diamond cd-bl"></div><div class="corner-diamond cd-br"></div>

            <h1 id="title-name">𝑆𝑙𝑒𝑠</h1>
            <div class="sub-title" id="sub-title">BOOK, LIBRARIAN, STAR AND CITY</div>
            
            <div class="data-row" id="row-1">
                <span class="label">identity // Ego</span>
                <span class="value">human // developer</span>
            </div>
            <div class="data-row" id="row-2">
                <span class="label">Likes // love</span>
                <span class="value">Develop // novel</span>
            </div>
            <div class="data-row" id="row-3">
                <span class="label">Age // Birthday</span>
                <span class="value">15 // 9/21</span>
            </div>
        </div>
    </div>

    <script>
        const uiCard = document.getElementById('ui-card');
        const rippleContainer = document.getElementById('ripple-container');

        // --- 1. 滑鼠座標與發光 ---
        document.addEventListener('mousemove', (e) => {
            const rect = uiCard.getBoundingClientRect();
            uiCard.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            uiCard.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        // --- 2. 點擊波紋效果 ---
        rippleContainer.addEventListener('mousedown', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = `90px`;
            ripple.style.left = `${e.clientX}px`;
            ripple.style.top = `${e.clientY}px`;
            rippleContainer.appendChild(ripple);
            setTimeout(() => {
                ripple.remove();
            }, 350);
        });

        // --- 3. 粒子畫布系統 ---
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');
        let particles = [];

        function resize() { 
            cBack.width = cFront.width = window.innerWidth; 
            cBack.height = cFront.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * cBack.width;
                this.y = initial ? Math.random() * cBack.height : cBack.height + 100;
                this.radius = Math.random() * 2.0 + 1.0;
                this.speedY = Math.random() * 1.5 + 0.8;   
                this.opacity = Math.random() * 0.3 + 0.2;
                this.layer = Math.random() > 0.6 ? 'front' : 'back';
            }
            update() {
                this.y -= this.speedY;
                if (this.y < -100) {
                    this.reset(false);
                }
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffea95';
                ctx.fillStyle = `rgba(255, 234, 149, ${this.opacity})`;
                ctx.fill();
                ctx.shadowBlur = 0; // 重置 Shadow 防止影響效能
            }
        }
        
        // 增加粒子密度
        for (let i = 0; i < 35; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);
            particles.forEach(p => {
                p.update();
                p.draw(p.layer === 'front' ? ctxFront : ctxBack);
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 4. 逐行刻印動畫 ---
        function startEngraving() {
            // 標題刻印
            setTimeout(() => {
                document.getElementById('title-name').classList.add('engraved');
            }, 100);

            // 副標刻印
            setTimeout(() => {
                document.getElementById('sub-title').classList.add('engraved');
            }, 400);

            // 資料列逐一刻印
            const rows = document.querySelectorAll('.data-row');
            rows.forEach((row, i) => {
                setTimeout(() => {
                    row.classList.add('engraved');
                    row.querySelector('.value').classList.add('engraved');
                }, 900 + (i * 450));
            });
        }

        window.onload = () => {
            setTimeout(startEngraving, 300);
        };
    </script>
    <script src="music_module.js"></script>
</body>
</html>
