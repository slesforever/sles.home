<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sles | Library Archive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #050505;
            color: #d4af37;
            font-family: "serif", "Microsoft JhengHei";
            overflow: hidden;
            user-select: none;
        }

        /* 背景層 */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('library.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.8) contrast(1.1);
        }

        /* 特效層：底層 (被 UI 擋住) */
        #canvas-back {
            position: fixed;
            top: 0; left: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* 特效層：頂層 (蓋過 UI) */
        #canvas-front {
            position: fixed;
            top: 0; left: 0;
            z-index: 5;
            pointer-events: none;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 4; /* 夾在兩個 Canvas 中間 */
        }

        /* Ruina 不規則 UI */
        .ruina-book {
            background: rgba(10, 10, 10, 0.93);
            width: 480px;
            padding: 60px 50px;
            position: relative;
            clip-path: polygon(3% 0%, 97% 2%, 100% 98%, 2% 100%, 0% 15%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 12px;
            margin: 0 0 40px 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: inline-block;
            opacity: 0;
            transition: all 2s ease;
        }

        .data-row { margin-bottom: 35px; }

        .label {
            font-size: 0.7rem;
            color: #d4af37;
            margin-bottom: 8px;
            letter-spacing: 4px;
            opacity: 0.5;
            display: block;
        }

        /* 螢光刻印文字 */
        .value {
            font-size: 1.2rem;
            color: #fff;
            line-height: 1.6;
            opacity: 0;
            filter: blur(8px);
            transition: opacity 1.8s ease, filter 1.5s ease, text-shadow 1.2s ease;
        }

        .value.engraved {
            opacity: 1;
            filter: blur(0px);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.9), 0 0 20px rgba(212, 175, 55, 0.4);
        }

        h1.engraved {
            opacity: 1;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    
    <!-- 兩個畫布實現立體感 -->
    <canvas id="canvas-back"></canvas>
    <canvas id="canvas-front"></canvas>

    <div class="main-container">
        <div class="ruina-book">
            <h1 id="title-name">Sles</h1>
            
            <div class="data-row">
                <span class="label">IDENTITY // 身份</span>
                <span class="value" id="text-identity">開發者 / 創作編劇</span>
            </div>

            <div class="data-row">
                <span class="label">STATUS // 狀態</span>
                <span class="value" id="text-status">在此處整理著散落的記憶與光芒。</span>
            </div>

            <div class="data-row">
                <span class="label">COLLECTION // 紀錄</span>
                <span class="value" id="text-collection">Project Moon Archive / Roblox Logic</span>
            </div>
        </div>
    </div>

    <script>
        const cBack = document.getElementById('canvas-back');
        const cFront = document.getElementById('canvas-front');
        const ctxBack = cBack.getContext('2d');
        const ctxFront = cFront.getContext('2d');

        let particles = [];

        function resize() {
            cBack.width = cFront.width = window.innerWidth;
            cBack.height = cFront.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * cBack.width;
                this.y = cBack.height + 50;
                this.radius = Math.random() * 4 + 1;
                this.speedY = Math.random() * 0.4 + 0.15;
                this.opacity = Math.random() * 0.5 + 0.1;
                // 隨機決定這個粒子在「前端」還是「後端」
                this.layer = Math.random() > 0.6 ? 'front' : 'back'; 
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y / 80) * 0.4;
                if (this.y < -50) this.reset();
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#d4af37';
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.fill();
            }
        }

        // 初始化粒子
        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animate() {
            ctxBack.clearRect(0, 0, cBack.width, cBack.height);
            ctxFront.clearRect(0, 0, cFront.width, cFront.height);

            particles.forEach(p => {
                p.update();
                if (p.layer === 'front') {
                    p.draw(ctxFront);
                } else {
                    p.draw(ctxBack);
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        // 刻印動畫
        function startEngraving() {
            document.getElementById('title-name').classList.add('engraved');
            const values = document.querySelectorAll('.value');
            values.forEach((el, i) => {
                setTimeout(() => el.classList.add('engraved'), 1000 + (i * 900));
            });
        }

        window.onload = () => setTimeout(startEngraving, 600);
    </script>
</body>
</html>
